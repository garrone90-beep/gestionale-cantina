# Sito statico: nessuna compilazione. index.html si rigenera dal prototipo con tools/build_site.py prima del commit.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cloud.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/prototipo/*"
  to = "/"
  status = 302
