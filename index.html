        if(grp) ev.gruppo=grp; return ev; });
      if(corrId){const o=S.eventi.find(x=>x.id===corrId); if(o.data===data) evs[0].ord=o.ord; if(o.gruppo) evs[0].gruppo=o.gruppo;}
      if(pending){ evs.forEach((ev,i)=>{ const r=$(`#conf input[name="rr${i}"]:checked`,b); if(r) ev.risultante=r.value===lastVid?vid:r.value; }); }
      else { const st=stateAt(data,evs[0].ord,corrId); const boxes=[];
        { const dL={}; evs.forEach(ev=>{ dL[ev.vasca]=(dL[ev.vasca]||0)+ev.L; }); const capO=oltreNominale(dL,st);
          if(capO.length) boxes.push(`<div class="box warn"><b>Oltre la capacità nominale.</b><ul style="margin:6px 0">${capO.map(x=>`<li>${oltreTxt(x)}</li>`).join('')}</ul>Se è giusto, conferma con «Conferma e salva».</div>`); }
        evs.forEach((ev,i)=>{ const s0=st[ev.vasca];
          if(s0.vino&&s0.vino===vid&&s0.L>1e-6) boxes.push(`<div class="box warn"><b>Unione di partite · ${esc(vnome(ev.vasca))}.</b> Contiene già ${esc(vName(s0.vino))} (${hL(s0.L)}). Questa entrata è una partita diversa dello stesso vino: unendole il nome resta <b>${esc(vName(s0.vino))}</b> e il programma tiene traccia di entrambe le partite.<input type="radio" name="rr${i}" value="${s0.vino}" checked hidden></div>`);
          else if(s0.vino&&s0.vino!==vid) boxes.push(`<div class="box warn"><b>Possibile assemblaggio · ${esc(vnome(ev.vasca))}.</b> Contiene già ${esc(vName(s0.vino))} (${hL(s0.L)}). Il vino risultante si chiama:<br>
            <label><input type="radio" name="rr${i}" value="${s0.vino}" checked> ${esc(vName(s0.vino))} (proposto)</label><br><label><input type="radio" name="rr${i}" value="${vid}"> ${esc(nv?nv.nome+' '+nv.annata:vName(vid))}</label></div>`); });
        if(boxes.length){ pending=true; lastVid=vid; $('#conf',b).innerHTML=boxes.join(''); $('#sv',b).textContent='Conferma e salva'; return; } }
      if(nv) S.vini.push(nv);
      evs.forEach((ev,i)=>storeEvent(ev,i===0?corrId:undefined));
      { const gr=$('#c-gr',b), tt=$('#c-tt',b); const v=gr?num(gr.value):null, T=tt?num(tt.value):null; if(evs[0].prodotto&&(v!=null||T!=null)){ const sc=$('#c-sc',b).value; S.scalaFerm=sc; evs.forEach(ev=>fermLog().push({id:uid(),vasca:ev.vasca,data,ora:oraAdesso(),val:v,scala:sc,T,note:'all\'arrivo',vino:vid})); } }
      { const cp=$('#c-prot',b); if(evs[0].prodotto&&cp&&cp.value) applicaProt(evs.map(e=>e.vasca),cp.value,data); }
      close(); refresh(); toast((evs[0].prodotto?'Entrata '+PROD_TXT[evs[0].prodotto]:'Entrata')+(evs.length>1?' salvata in '+evs.length+' vasche':' salvata'));
      if(nextAct==='an') formAnalisi(vid,null,{data,ambito:'vasca',vasche:evs.map(e=>e.vasca)}); else if(nextAct==='ref') formReferto(vid);
    };
  });
}

/* ===================== Form: imbottigliamento ===================== */
const FORMATI=[{k:'b0.5',L:0.5,t:'Bottiglia'},{k:'b0.75',L:0.75,t:'Bottiglia'},{k:'b1.5',L:1.5,t:'Bottiglia'},{k:'bib5',L:5,t:'Bag in box'},{k:'bib10',L:10,t:'Bag in box'}];
const confTipo = e=>e.conf||(e.formato>=5?'Bag in box':'Bottiglia');
const fmtTxt = e=>e.formato?`${confTipo(e).toLowerCase()} ${nf(e.formato,3)} L`:'';
const pezzi = (e,n)=>confTipo(e)==='Bag in box'?'bag in box':(n===1?'bottiglia':confTipo(e)==='Altro'?'confezioni':'bottiglie');
const bott = e=>e.bottiglie||(e.formato?Math.floor(e.L/e.formato+1e-9):0);
function propLotto(d){ const dt=new Date(d+'T12:00:00'); const doy=Math.floor((dt-new Date(dt.getFullYear(),0,0))/864e5); return 'L'+String(dt.getFullYear()).slice(2)+String(doy).padStart(3,'0'); }
function formImbottigliamento(p={},corrId){
  const fk=FORMATI.find(x=>x.L===p.formato&&(!p.conf||p.conf===x.t)); const fmtSel=p.formato?(fk?fk.k:'altro'):'b0.75';
  modal(corrId?'Correggi imbottigliamento':'Imbottigliamento',`
  <form id="fi" novalidate><p class="hint">Scrivi la quantità uscita <b>oppure</b> il numero di pezzi: l'altro si calcola da solo e puoi correggerlo. Il vino che resta in vasca rimane lo stesso vino.</p><div class="fg">
    <label class="f">Data<input type="date" id="i-data" value="${esc(p.data||today())}"></label>
    <label class="f">Vasca<select id="i-v">${vascaOpts(p.vasca,true)}</select></label>
    <label class="f"><span id="i-Ll">Quantità uscita</span><input id="i-L" inputmode="decimal" value="${p.L!=null?nfIn(p.L/100,3):''}"></label>
    <label class="f">Unità${unitSel('i-u')}</label>
    <label class="f">Lotto<span class="row" style="gap:6px;flex-wrap:nowrap"><input id="i-lot" value="${esc(p.lotto||'')}" placeholder="es. L26306"><button type="button" class="btn sm" id="i-prop" title="Proponi lotto da data: anno + giorno dell'anno">Proponi</button></span></label>
    <label class="f">Formato<select id="i-fmt"><optgroup label="Bottiglia">${FORMATI.filter(x=>x.t==='Bottiglia').map(x=>`<option value="${x.k}" ${fmtSel===x.k?'selected':''}>Bottiglia ${nf(x.L,3)} L</option>`).join('')}</optgroup><optgroup label="Bag in box">${FORMATI.filter(x=>x.t==='Bag in box').map(x=>`<option value="${x.k}" ${fmtSel===x.k?'selected':''}>Bag in box ${nf(x.L,3)} L</option>`).join('')}</optgroup><option value="altro" ${fmtSel==='altro'?'selected':''}>altro…</option></select></label>
    <label class="f" id="i-fmtw" ${fmtSel==='altro'?'':'hidden'}>Formato (L)<input id="i-fmto" inputmode="decimal" value="${fmtSel==='altro'?nfIn(p.formato,3):''}"></label>
    <label class="f"><span id="i-btl">Pezzi</span><input id="i-bt" inputmode="numeric" value="${p.bottiglie||''}" placeholder="auto"></label>
   </div>
   <div id="i-calc" class="hint"></div>
   <label class="f wide">Note<textarea id="i-note">${esc(p.note||'')}</textarea></label>
   <div id="msg" class="err"></div>
   <div class="foot"><button type="button" class="btn" data-close>Annulla</button><button class="btn pri">Salva</button></div></form>`,(b,close)=>{
    let okImp=false, okEcc=false, okDup=false, okPz=false, manual=!!p.bottiglieManuali, Lman=p.L!=null&&p.litriManuali!==false;
    const fmtO=()=>FORMATI.find(x=>x.k===$('#i-fmt',b).value); const fmt=()=>$('#i-fmt',b).value==='altro'?num($('#i-fmto',b).value):fmtO().L; const conf=()=>$('#i-fmt',b).value==='altro'?'Altro':fmtO().t;
    const calc=()=>{ let fm=fmt(); const u=$('#i-u',b).value;
      if(manual&&!Lman){ const bt0=num($('#i-bt',b).value); $('#i-L',b).value=bt0&&fm?nfIn(u==='hL'?bt0*fm/100:bt0*fm,3):''; }
      else if(!manual&&!Lman) $('#i-L',b).value='';
      const L=toL($('#i-L',b).value,u);
      $('#i-Ll',b).textContent='Quantità uscita'+(Lman?'':(manual&&L?' (calcolata)':'')); $('#i-fmtw',b).hidden=$('#i-fmt',b).value!=='altro';
      const pz=conf()==='Bag in box'?'Bag in box':conf()==='Altro'?'Confezioni':'Bottiglie'; $('#i-btl',b).textContent=pz+(manual?' (modificato)':' (calcolato)');
      const n=L&&fm?Math.floor(L/fm+1e-9):0;
      if(!manual&&Lman) $('#i-bt',b).value=n?String(n):''; else if(!manual&&!Lman) $('#i-bt',b).value='';
      const bt=num($('#i-bt',b).value), tot=bt&&fm?bt*fm:0, diff=L?L-tot:0;
      const warn = bt&&L&&(tot>L+1e-6 || diff>Math.max(fm,L*0.02));
      $('#i-calc',b).className = warn?'box warn small':'hint';
      $('#i-calc',b).innerHTML = !n&&!bt?'' : warn
        ? `<b>Controlla i conti:</b> ${nf(bt,0)} ${pz.toLowerCase()} da ${nf(fm,3)} L = <b>${nf(tot,1)} L</b>, ma la quantità uscita è <b>${nf(L,1)} L</b> (${tot>L?'mancano':'avanzano'} ${nf(Math.abs(diff),1)} L). Puoi usare <button type="button" class="btn sm" id="i-reset">${nf(n,0)} ${pz.toLowerCase()}</button> oppure <button type="button" class="btn sm" id="i-resetL">${nf(bt*fm,1)} L usciti</button>`
        : `${nf(bt||n,0)} ${pz.toLowerCase()} da ${nf(fm,3)} L = ${nf((bt||n)*fm,1)} L su ${nf(L,1)} L usciti${diff>1e-6&&bt?` · differenza ${nf(diff,1)} L (cali/residui)`:''}`;
      const rs=$('#i-reset',b); if(rs) rs.onclick=()=>{manual=false; okPz=false; calc();};
      const rl=$('#i-resetL',b); if(rl) rl.onclick=()=>{Lman=false; okPz=false; calc();};
      return warn; };
    $('#i-prop',b).onclick=()=>{ $('#i-lot',b).value=propLotto($('#i-data',b).value||today()); okDup=false; };
    $('#i-bt',b).addEventListener('input',()=>{ manual=$('#i-bt',b).value.trim()!==''; });
    $('#i-L',b).addEventListener('input',()=>{ Lman=$('#i-L',b).value.trim()!==''; });
    $('#fi',b).oninput=e=>{ if(e.target&&e.target.name==='impI') return; okImp=false;okEcc=false;okDup=false;okPz=false;$('#msg',b).textContent='';$('#fi button.pri',b).textContent='Salva';calc();};
    $('#fi',b).onchange=calc; calc();
    $('#fi',b).onsubmit=e=>{e.preventDefault();
      const vasca=$('#i-v',b).value,L=toL($('#i-L',b).value,$('#i-u',b).value), lotto=$('#i-lot',b).value.trim(), f=fmt();
      if(!vasca||!L){$('#msg',b).textContent='Scegli la vasca e inserisci la quantità uscita.';return;}
      if(!lotto){$('#msg',b).textContent='Inserisci il lotto (o premi «Proponi»).';return;}
      if(!f){$('#msg',b).textContent='Indica il formato della bottiglia.';return;}
      const data=$('#i-data',b).value||today();
      const ev={id:uid(),tipo:'imbottigliamento',data,ord:Date.now(),fase:'Affinamento',vasca,L,lotto,formato:f,conf:conf(),bottiglie:num($('#i-bt',b).value)||null,bottiglieManuali:manual,litriManuali:Lman,note:$('#i-note',b).value.trim(),creatoIl:new Date().toISOString()};
      if(corrId){const o=S.eventi.find(x=>x.id===corrId); if(o.data===data) ev.ord=o.ord;}
      const dup=attivi(S.eventi).find(x=>x.tipo==='imbottigliamento'&&x.id!==corrId&&String(x.lotto||'').toLowerCase()===lotto.toLowerCase());
      if(calc()&&!okPz){ okPz=true; $('#msg',b).innerHTML='<div class="box warn" style="color:var(--ink);font-weight:400">Il numero di pezzi non torna con la quantità uscita (vedi sopra). Premi di nuovo per salvare comunque, oppure correggi.</div>'; $('#fi button.pri',b).textContent='Conferma e salva'; return; }
      if(dup&&!okDup){ okDup=true; $('#msg',b).innerHTML=`<div class="box warn" style="color:var(--ink);font-weight:400"><b>Lotto già usato.</b> «${esc(lotto)}» esiste già: ${fd(dup.data)}, ${esc(vnome(dup.vasca))}, ${hL(dup.L)}. Se è lo stesso lotto (es. imbottigliato in più giorni o da più vasche) conferma, altrimenti cambia il codice.</div>`; $('#fi button.pri',b).textContent='Conferma e salva'; return; }
      const st1=stateAt(data,ev.ord,corrId)[vasca];
      if(st1.imp&&!okImp){ okImp=true; $('#msg',b).innerHTML+=`<div class="box warn" style="color:var(--ink);font-weight:400"><b>Vasca in lavorazione.</b> ${impTxt(st1.imp,data)}. La lavorazione è finita?<br><label><input type="radio" name="impI" value="si" checked> Sì, è finita</label> <label><input type="radio" name="impI" value="no"> No, continua</label></div>`; $('#fi button.pri',b).textContent='Conferma e salva'; return; }
      if(st1.imp){ const r=$('input[name=impI]:checked',b); if(!r||r.value==='si') ev.chiudeLav=[vasca]; }
      const disp=st1.L;
      if(L>disp+1e-6&&!okEcc){ okEcc=true; $('#msg',b).innerHTML+=`<div class="box warn" style="color:var(--ink);font-weight:400"><b>Esce più vino di quello presente.</b> Nella ${esc(vnome(vasca))} risultano ${hL(disp)}, ne escono ${hL(L)}. Se confermi la vasca risulta vuota e i ${hL(L-disp)} in più restano registrati da verificare.</div>`; $('#fi button.pri',b).textContent='Conferma e salva'; return; }
      storeEvent(ev,corrId); close(); refresh(); toast((corrId?'Correzione salvata':'Imbottigliamento salvato')+' · lotto '+lotto); if(corrId&&location.hash==='#lotto-'+corrId) location.hash='lotto-'+ev.id;};
  });
}

function lottoProv(e){ const info=R.imb[e.id]; if(!info||!info.node) return null; const G=genData(info.node, info.i, 'op'); return {info,G}; }
function provShort(G){ return Object.entries(G.compo).filter(([,f])=>f>1e-9).sort((a,b)=>b[1]-a[1]).map(([k,f])=>{
  if(k.startsWith('own:')){ const ot=origTxt(R.nodes[k.slice(4)]); return `${esc(vName(G.root.vino))}${ot?' · '+esc(ot):''} ${nf(f*100,0)}%`; }
  const bd=G.bounds[k]; return `${esc(vName(bd.p.vino))} ${nf(f*100,1)}%`; }).join('<br>'); }

   <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Lotto</th><th>Vino</th><th>Vasca</th><th class="r">Quantità</th><th>Formato</th><th class="r">Pezzi</th><th>Provenienza</th></tr></thead><tbody>

  let t; $('#ql',app).oninput=e=>{clearTimeout(t); t=setTimeout(()=>{UI.qLotto=e.target.value; viewImb(app); const i=$('#ql',app); i.focus(); i.setSelectionRange(i.value.length,i.value.length);},300);};

  else { if(UI.lotFor!==id){ UI.lotFor=id; UI.lotStack=[]; } UI.lotStack=(UI.lotStack||[]).filter(f=>R.nodes[f.p]&&R.nodes[f.c]);

  const fit=(text,maxW,maxH,size,bold)=>{ let sz=size, lines; do{ g.font=`${bold?'700 ':''}${sz}px ${FONT}`; lines=wrap(String(text||''),maxW); sz-=4; } while((lines.length*sz*1.2>maxH||lines.some(l=>g.measureText(l).width>maxW))&&sz>20); return {lines,sz:sz+4}; };
  const wrap=(t,maxW)=>{ const out=[]; t.split('\n').forEach(par=>{ let line=''; par.split(' ').forEach(w=>{ const tt=line?line+' '+w:w; if(g.measureText(tt).width>maxW&&line){out.push(line);line=w;} else line=tt; }); out.push(line); }); return out; };
  const draw=(text,x,w,top,h,size,bold,align)=>{ const r=fit(text,w-60,h<120?h-6:h-30,size,bold); g.font=`${bold?'700 ':''}${r.sz}px ${FONT}`; g.textAlign=align||'left'; const lh=r.sz*1.18, y0=top+h/2-(r.lines.length-1)*lh/2; r.lines.forEach((l,i)=>g.fillText(l,align==='center'?x+w/2:x+30,y0+i*lh)); };
  rows.forEach(([lab,val,hh,kind])=>{ const h=hh*U;
    g.strokeRect(X0,y,X2-X0,h);
    if(lab==='__banner'){ g.lineWidth=12; g.strokeRect(X0,y,X2-X0,h); g.lineWidth=5; draw(val,X0,X2-X0,y,h,Math.round(h*0.7),true,'center'); }

      draw(val,X1,X2-X1,y,h,kind==='big'?Math.round(U*0.78):kind==='mid'?Math.round(U*0.5):Math.round(U*0.32),false); }
    y+=h; });

  const fd2={...f,categoria:'DOP'}; const ex=findVino(fd2); const partial=sel.length<all.length;

    const w=vino(p.id); Object.assign(w,{...fd2,nome:composeNome(fd2.categoria,fd2.denominazione,fd2.fantasia),tipo:coloreDi(fd2),alias,note}); if(idon) w.idoneita=idon;
    S.eventi.push({...ev,nuovoVino:p.id,inPlace:true}); close(); refresh(); toast('Vino certificato: ora è '+vName(p.id)); return; }
  let tid; if(ex) tid=ex.id; else { const r=pickerResolve(fd2); S.vini.push({...r.nuovo,note:'Certificato DOP da '+vName(p.id)+(partial?' ('+(sel.length>1?'vasche ':'vasca ')+sel.map(vlab).join(', ')+')':'')}); tid=r.nuovo.id; }
  if(idon) vino(tid).idoneita=idon; Object.assign(vino(p.id),{alias,note});
  S.eventi.push({...ev,nuovoVino:tid,inPlace:false}); close(); location.hash='vino-'+tid; refresh();
  toast((sel.length?(sel.length>1?'Vasche ':'Vasca ')+sel.map(vlab).join(', ')+' certificat'+(sel.length>1?'e':'a'):'Vino certificato')+': ora '+vName(tid)); }

function fmtVal(x){ if(!x) return ''; if(x.lod) return x.v!=null?'&lt;'+nf(x.v,3):'&lt; LR'; if(x.v==null) return ''; return nf(x.v,3); }
/* analisi di un vino + quelle ereditate da «Atto a» prima della certificazione (REG-VINO-06) */
function certFonti(id){ const evOf=x=>S.eventi.find(e=>e.id===x.ev)||{}; const g={};
  ((R&&R.apporti[id])||[]).filter(a=>a.da&&a.da!==id&&evOf(a).tipo==='certificazione').forEach(a=>{ const x=g[a.da]=g[a.da]||{dmax:'',vs:[]}; if(a.data>x.dmax) x.dmax=a.data; x.vs.push(a.vasca); });
  return Object.entries(g).map(([sv,x])=>({sv,...x,filt:a=>a.data<=x.dmax&&(a.ambito!=='vasca'||anVasche(a).some(c=>x.vs.includes(c)))})); }
function anVino(id){ return [...S.analisi.filter(a=>a.vino===id),...certFonti(id).flatMap(f=>S.analisi.filter(a=>a.vino===f.sv&&f.filt(a)).map(a=>({...a,_da:f.sv})))]; }
function analisiTable(id,readonly,filt){
  const an=(filt?S.analisi.filter(a=>a.vino===id&&filt(a)):anVino(id)).sort((a,b)=>a.data<b.data?-1:1);
  if(!an.length) return `<div class="empty">Nessuna analisi.${readonly?'':' Usa «Nuova analisi» o importa un referto.'}</div>`;
  const used=new Set(an.flatMap(a=>Object.keys(a.valori)));
  const params=[...S.parametri.map(p=>p.nome),...[...used].filter(u=>!S.parametri.some(p=>p.nome===u))];
  const udm=n=>(S.parametri.find(p=>p.nome===n)||{}).udm||'';
  return `<p class="hint">Date in colonna, parametri in riga. Cella vuota = non determinato; «0» = misurato zero; «&lt;0,1» = sotto il limite di rilevabilità indicato (0,1); «&lt; LR» = sotto il limite, valore del limite non indicato.</p>
  <div class="tbl-wrap"><table class="an"><thead><tr><th class="p">Parametro</th><th>Unità</th>${an.map(a=>`<th class="r">${fd(a.data)}<br><span class="chip" style="text-transform:none;letter-spacing:0">${esc(anAmbitoTxt(a))}</span>${a.lab?`<br><span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(a.lab)}</span>`:''}${a.stimata?'<br><span class="chip warn" style="text-transform:none;letter-spacing:0">stimata</span>':''}${a._da?`<br><span class="chip" style="text-transform:none;letter-spacing:0" title="Analisi fatta quando il vino era ${esc(vName(a._da))}">prima della certificazione</span>`:''}${!readonly?`<br><button class="btn sm ghost" data-aed="${a.id}" data-av="${a._da||''}">Correggi</button>`:''}</th>`).join('')}</tr></thead>
  <tbody>${params.map(p=>`<tr><td class="p">${esc(p)}</td><td class="muted">${esc(udm(p))}</td>${an.map(a=>{const x=a.valori[p];const s=fmtVal(x);return `<td class="v ${s?'':'nd'}">${s?(x&&x.fl?`<span class="an-fl" title="Fuori dall'intervallo consueto: valore confermato al salvataggio">${s} !</span>`:s):'·'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  ${an.some(a=>a.note||a.fonte||a.controlli)?`<ul class="small muted" style="margin-top:8px">${an.filter(a=>a.note||a.fonte||a.storia?.length||a.controlli).map(a=>`<li>${fd(a.data)}: ${esc([a.fonte&&'fonte '+a.fonte,a.note,a.storia?.length?`corretta ${a.storia.length} volta/e, versioni precedenti conservate`:'',a.controlli?'confermati al salvataggio, fuori dall\'intervallo consueto: '+a.controlli.avvisi.join(' · '):''].filter(Boolean).join(' · '))}</li>`).join('')}</ul>`:''}
  ${an.some(a=>a.controlli)?'<p class="hint">«!» = valore fuori dall\'intervallo consueto, confermato da chi l\'ha inserito.</p>':''}`;
}
function originAnalisi(id){
  const certSrc=certFonti(id).map(f=>f.sv); const out='';
  const src=[...new Set((R.apporti[id]||[]).filter(a=>a.da&&!certSrc.includes(a.da)).map(a=>a.da))].filter(s=>S.analisi.some(a=>a.vino===s));
  if(!src.length) return out;
  return out+`<details style="margin-top:16px"><summary><b>Analisi dei vini di provenienza</b> <span class="muted small">(solo consultazione: non sono analisi di questo vino)</span></summary>${src.map(s=>`<h3 style="margin:12px 0 6px">${esc(vName(s))}</h3>${analisiTable(s,true)}`).join('')}</details>`;
}
function provenienza(id){
  const st=S.eventi.filter(e=>e.storico&&(e.vini||[]).includes(id)&&(!e.stato||e.stato==='attivo'));
  const conf=st.flatMap(e=>(e.conferimenti||[]).map(c=>({...c,data:e.data})));
  const appS=st.flatMap(e=>(e.apporti||[]).map(a=>({...a,data:e.data})));
  const ap=R.apporti[id]||[];
  const derivati=S.vini.filter(w=>(R.apporti[w.id]||[]).some(a=>a.da===id));
  return `<div class="row" style="flex-direction:column;align-items:stretch;gap:16px">
   ${conf.length?`<div><h3>Uve conferite</h3><div class="tbl-wrap" style="margin-top:6px"><table><thead><tr><th>Data</th><th>Provenienza</th><th class="r">Quantità</th></tr></thead><tbody>${conf.map(c=>`<tr><td>${fd(c.data)}</td><td>${esc(c.fonte)}</td><td class="r">${nf(c.qta)} ${esc(c.udm)}</td></tr>`).join('')}<tr><td></td><td><b>Totale</b></td><td class="r"><b>${nf(conf.reduce((a,c)=>a+c.qta,0))} kg</b></td></tr></tbody></table></div></div>`:''}
   ${appS.length||ap.length?`<div><h3>Apporti e assemblaggi</h3><div class="tbl-wrap" style="margin-top:6px"><table><thead><tr><th>Data</th><th>Da</th><th class="r">Quantità</th><th>Tipo</th></tr></thead><tbody>
     ${appS.map(a=>`<tr><td>${fd(a.data)}</td><td>${a.vino?`<a href="#vino-${a.vino}">${esc(a.descr)}</a>`:esc(a.descr)}</td><td class="r">${nf(a.qta)} ${esc(a.udm)}</td><td><span class="chip">Storico Excel</span></td></tr>`).join('')}
     ${ap.map(a=>`<tr><td>${fd(a.data)}</td><td>${a.da?`<a href="#vino-${a.da}">${esc(vName(a.da))}</a>`:esc(a.descr)}</td><td class="r">${hL(a.L)}</td><td><span class="chip">${a.tipo==='assemblaggio'?'Assemblaggio in '+esc(a.vasca):a.tipo==='origine'?'Nato da porzione':a.tipo==='fecce'?'Fecce in '+esc(a.vasca):'Entrata'}</span></td></tr>`).join('')}
   </tbody></table></div></div>`:''}
   ${derivati.length?`<div><h3>Vini che contengono questo vino</h3><div class="row" style="margin-top:6px">${derivati.map(w=>`<a class="chip" href="#vino-${w.id}">${esc(vName(w.id))}</a>`).join('')}</div></div>`:''}
   ${!conf.length&&!appS.length&&!ap.length&&!derivati.length?'<div class="empty">Nessuna provenienza registrata.</div>':''}
   <p class="hint">Le quantità dello storico Excel sono quelle annotate; non sono state ricostruite giacenze esatte.</p></div>`;
}

/* ===================== Form: analisi ===================== */

  const ed=editId?S.analisi.find(a=>a.id===editId):null;
  const prev=anVino(vid).filter(a=>a.id!==editId).sort((a,b)=>a.data<b.data?1:-1);
  const refOf=p=>{for(const a of prev){const x=a.valori[p]; if(x&&(x.v!=null||x.lod)) return `${fmtVal(x)} (${fd(a.data)})`;} return '';};
  const tv=vinoTot(vid).vs;
  const inp=x=>!x?'':x.lod?'<'+(x.v!=null?nfIn(x.v,3):''):x.v==null?'':nfIn(x.v,3);
  modal(ed?'Correggi analisi':'Nuova analisi · '+vName(vid),`<form id="fa" novalidate>
   <div class="fg">
    <label class="f">Data prelievo<input type="date" id="a-d" value="${esc(ed?.data||preset?.data||today())}"></label>
    <div style="grid-column:1/-1" id="a-ambw">${ambitoHTML('a',vid,ed?.data||preset?.data||today(),ed?{ambito:ed.ambito,vasche:anVasche(ed)}:preset||null)}</div>
    <label class="f">Laboratorio<input id="a-lab" value="${esc(ed?.lab||'')}" placeholder="es. OINOS, interno"></label>
   </div>
   <p class="hint">Si parte vuoti: i valori precedenti sono solo di riferimento. Lascia vuoto ciò che non è determinato; scrivi «&lt;» davanti per un valore sotto il limite di rilevabilità.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Parametro</th><th>Unità</th><th>Valore</th><th>Riferimento</th></tr></thead><tbody id="ap">

let _pdfjs=null, _pdfBase='';
function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  const B4='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/', B3='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const addScript=src=>new Promise((res,rej)=>{const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('script')); document.head.append(sc);});
  _pdfjs=import(B4+'pdf.min.mjs').then(m=>{ m.GlobalWorkerOptions.workerSrc=B4+'pdf.worker.min.mjs'; _pdfBase=B4; return m; })
    .catch(()=>addScript(B3+'pdf.min.js').then(()=>addScript(B3+'pdf.worker.min.js')).then(()=>{ const m=window.pdfjsLib; m.GlobalWorkerOptions.workerSrc=B3+'pdf.worker.min.js'; return m; }))
    .catch(e=>{ _pdfjs=null; throw e; });
  return _pdfjs;
}
async function fileToImages(file,maxImgs,onStep){
  if(file.type.startsWith('image/')) return {images:[file],testo:''};
  const lib=await loadPdfJs(); const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,wasmUrl:_pdfBase?_pdfBase+'wasm/':undefined}).promise;
  const images=[]; let testo='';
  for(let n=1;n<=pdf.numPages;n++){
    onStep&&onStep(`Leggo la pagina ${n} di ${pdf.numPages}…`);
    const page=await pdf.getPage(n);
    try{ const tc=await page.getTextContent(); testo+=tc.items.map(x=>x.str).join(' ')+'\n'; }catch(e){}
    const v1=page.getViewport({scale:1}); const scale=2200/Math.max(v1.width,v1.height); const vp=page.getViewport({scale});
    const cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
    const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    // due ritagli sovrapposti per pagina: più dettaglio dopo il ridimensionamento
    const parts=cv.width>=cv.height?[[0,0.56],[0.44,1]]:[[0,0.4],[0.3,0.7],[0.6,1]];
    for(const [a,b2] of parts){ if(images.length>=maxImgs) break; const y0=Math.floor(cv.height*a), h=Math.ceil(cv.height*(b2-a));
      const c2=document.createElement('canvas'); c2.width=cv.width; c2.height=h; c2.getContext('2d').drawImage(cv,0,y0,cv.width,h,0,0,cv.width,h);
      images.push(await new Promise(r=>c2.toBlob(r,'image/jpeg',0.9))); }
    if(images.length>=maxImgs) break;
  }
  return {images,testo:testo.trim()};
}

/* Solo controllo: legge le stampe «Giacenza prodotti» di Maxidata e le confronta con il gestionale. Non modifica nulla.
   Gli abbinamenti confermati sono ricordati per descrizione (mai per codice) in S.maxiMap / S.maxiConti, senza mostrarli. */
async function fileToText(file){
  const lib=await loadPdfJs(); const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,wasmUrl:_pdfBase?_pdfBase+'wasm/':undefined}).promise;
  let out='';
  for(let n=1;n<=pdf.numPages;n++){ const page=await pdf.getPage(n); const tc=await page.getTextContent(); const rows={};
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/3)*3; (rows[y]=rows[y]||[]).push({x:it.transform[4],w:it.width||0,s:it.str}); });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{ const r=rows[y].sort((a,b)=>a.x-b.x); let line='', end=0;
      r.forEach(it=>{ const gap=it.x-end; line+=(line?(gap>12?'   ':' '):'')+it.s; end=it.x+it.w; }); out+=line+'\n'; });
    out+='\n'; }
  return out.trim();
}

function giacenzePerProv(data){
  const R0=R; let out={};
  try{ R=replay(S.eventi,{data:data||asOf(),ord:Infinity});

  } finally { R=R0; }
  return out;
}
function maxiRisultato(b,dati){
  const data=dati.map(d=>d.data).filter(Boolean).sort().pop()||asOf();
  const G=giacenzePerProv(data); const provs=[...new Set(dati.map(d=>d.provenienza).filter(Boolean))];
  const fmtQ=(L,fecce)=>fecce?`${nf(L*KG_L,0)} kg`:hL(L);
  let html=`<div class="panel" style="margin-top:12px"><h3>Risultato del confronto</h3><p class="hint">Gestionale alla data della stampa (${fd(data)}). Fecce confrontate in kg con 1 L ≈ ${nf(KG_L,2)} kg. Tolleranza: 1 L per il vino, 2 kg per le fecce.</p>`;
  let nDiff=0;
  const blocchi=[...dati.map(d=>({titolo:d.conto||d.file,prov:d.provenienza,righe:d.righe}))];
  const usati=new Set();

    bl.righe.forEach(x=>{ const k=x.vino_id||('?'+x.descrizione); const o=per[k]=per[k]||{vino:x.vino_id,descr:new Set(),M:0,fecce:false}; o.descr.add(x.descrizione+(x.partita?' ('+x.partita+')':'')); o.fecce=o.fecce||x.udm==='kg'||!!(vino(x.vino_id)||{}).fecce;
      o.M+= x.udm==='kg'?x.quantita/KG_L:x.quantita; });
    if(bl.prov) Object.values(G).filter(g=>g.prov===bl.prov).forEach(g=>{ if(!per[g.vino]) per[g.vino]={vino:g.vino,descr:new Set(),M:0,fecce:!!(vino(g.vino)||{}).fecce}; });
    const rows=Object.values(per).map(o=>{ const g=bl.prov&&o.vino?G[bl.prov+'||'+o.vino]:null; if(g) usati.add(bl.prov+'||'+o.vino);
      const Lg=g?g.L:0, d=Lg-o.M, ok=o.fecce?Math.abs(d*KG_L)<=2:Math.abs(d)<=1; if(!ok) nDiff++;
      return `<tr style="${ok?'':'background:var(--warn-bg)'}"><td>${o.vino?`${tipoDot(o.vino)} <b>${esc(vName(o.vino))}</b>`:'<span class="chip warn">non abbinato</span>'}<div class="small muted">${[...o.descr].map(esc).join(' · ')||'— non presente in Maxidata'}</div></td>
        <td class="r num">${o.M?fmtQ(o.M,o.fecce):'—'}</td><td class="r num">${g?fmtQ(Lg,o.fecce):'—'}${g?`<div class="small muted">${g.vs.map(c=>esc(vlab(c))).join(', ')}</div>`:''}</td>
        <td class="r num">${ok?'<span class="chip ok">ok</span>':`<b>${d>0?'+':''}${fmtQ(d,o.fecce)}</b>`}</td></tr>`; }).join('');
    html+=`<h4 style="margin:14px 0 6px">${esc(bl.titolo)}${bl.prov?` <span class="muted small">→ ${esc(bl.prov)}</span>`:' <span class="chip warn">conto lavorazione non indicato</span>'}</h4>
     <div class="tbl-wrap"><table><thead><tr><th>Vino</th><th class="r">Maxidata</th><th class="r">Gestionale</th><th class="r">Differenza</th></tr></thead><tbody>${rows}</tbody></table></div>`; });

const PKEY = n=>String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/so₂/g,'so2').replace(/[^a-z0-9]/g,'');

  totale:'Acidità totale',aciditatotale:'Acidità totale',at:'Acidità totale',volatile:'Acidità volatile',aciditavolatile:'Acidità volatile',av:'Acidità volatile',

  potassio:'Potassio',k:'Potassio',calcio:'Calcio',rame:'Rame',densita:'Densità',ferro:'Controllo Fe'};
function normParam(nome){ const n=String(nome||'').trim(); const k=PKEY(n); if(!k) return n;
  const f=S.parametri.find(p=>PKEY(p.nome)===k); if(f) return f.nome;
  const syn=PSYN[k]; if(syn&&S.parametri.some(p=>p.nome===syn)) return syn;
  return n.replace(/\s*\((.*?)\)\s*$/,'').trim()||n; }
function fixParams(){ if(!S||!S.parametri) return; const keep=[]; const ren={};
  S.parametri.forEach(p=>{ const k=PKEY(p.nome); const base=keep.find(q=>PKEY(q.nome)===k)||(PSYN[k]?keep.find(q=>q.nome===PSYN[k])||S.parametri.find(q=>q.nome===PSYN[k]&&q!==p):null);
    if(base&&base!==p){ ren[p.nome]=base.nome; } else keep.push(p); });
  if(!Object.keys(ren).length) return false;

  (S.analisi||[]).forEach(a=>{ Object.keys(a.valori||{}).forEach(k=>{ if(ren[k]){ const v=a.valori[k]; delete a.valori[k]; if(!a.valori[ren[k]]) a.valori[ren[k]]=v; } }); });

function formContenitore(c,locId){
  const nuovo=!c; c=c||{tipo:'vasca',locale:locId}; const loc=LOCMAP[c.locale]||{};
  const usato=!nuovo&&S.eventi.some(e=>JSON.stringify(e).includes('"'+c.id+'"'));
  modal(nuovo?'Aggiungi contenitore · '+loc.nome:'Modifica '+vkind(c.id).toLowerCase()+' '+vlab(c.id),`<form id="fco" novalidate><div class="fg">

    <label class="f">Capacità nominale (hL)<input id="co-cap" inputmode="decimal" value="${c.cap!=null?nfIn(c.cap):''}"></label>
    <label class="f">Capacità operativa (hL, facoltativa)<input id="co-op" inputmode="decimal" value="${c.capOp!=null?nfIn(c.capOp):''}"></label>
    <label class="f">Fila / gruppo (facoltativo)<input id="co-g" value="${esc(c.gruppo||'')}" placeholder="es. A, 3, Scaffale B"></label>
    <label class="f">Posto (facoltativo)<input id="co-p" value="${esc(c.posto||'')}" placeholder="es. 12"></label>
    <label class="f wide">Note<input id="co-no" value="${esc(c.note||'')}"></label></div>
    ${usato?`<p class="hint">Questo contenitore compare già nello storico. Modifica il codice o la capacità solo per <b>correggere un errore</b>: la correzione viene annotata. Se la vasca è cambiata davvero (sostituita, ridotta…) usa «Altro ▾ → Sostituisci».</p>`:''}
    <div id="co-conf"></div><div id="msg" class="err"></div><div class="foot"><button type="button" class="btn" data-close>Annulla</button><button class="btn pri" id="sv">${nuovo?'Aggiungi':'Salva'}</button></div></form>`,(b,close)=>{
    let confKey=''; $('#fco',b).addEventListener('input',e=>{ if(!e.target.closest('#co-conf')){ $('#co-conf',b).innerHTML=''; confKey=''; $('#sv',b).textContent=nuovo?'Aggiungi':'Salva'; } });
    $('#fco',b).onsubmit=e=>{ e.preventDefault(); const m=$('#msg',b); m.textContent='';
      const codice=$('#co-c',b).value.trim(), tipo=$('#co-t',b).value, cap=num($('#co-cap',b).value), capOp=num($('#co-op',b).value), note=$('#co-no',b).value.trim(), gruppo=$('#co-g',b).value.trim(), posto=$('#co-p',b).value.trim();
      if(!codice) return m.textContent='Scrivi il codice visibile.';
      if(!(cap>0)) return m.textContent='Scrivi la capacità nominale in hL.';
      if(VASCHE.some(v=>v.dep===c.locale&&v.stato==='attivo'&&v.code!==c.id&&v.label.toLowerCase()===codice.toLowerCase())) return m.textContent='Nel locale c\'è già un contenitore attivo con il codice «'+codice+'».';
      const W=[]; const sg=loc.sigla||''; const omon=VASCHE.filter(v=>v.code!==c.id&&v.stato==='attivo'&&v.dep!==c.locale&&vlab(v.code).toLowerCase()===((sg?sg+' ':'')+codice).toLowerCase());
      if(omon.length) W.push({k:'omon',t:`A video si leggerebbe «${esc((sg?sg+' ':'')+codice)}» come ${omon.map(v=>esc(vkind(v.code).toLowerCase())+' di '+esc(locNome(v.dep))).join(', ')}: nei moduli potrebbero confondersi. Valuta una sigla diversa per il locale.`,ok:'Va bene lo stesso'});
      if(capOp!=null&&capOp>cap) W.push({k:'op',t:'La capacità operativa è maggiore della nominale.',ok:'È corretto'});
      if(W.length){ const key=W.map(w=>w.k).join(); const ok=W.every(w=>{ const x=$(`[data-ok="${w.k}"]`,b); return x&&x.checked; });
        if(key!==confKey||!ok){ if(key!==confKey){ confKey=key; $('#co-conf',b).innerHTML=`<div class="box warn small" style="margin:8px 0">${W.map(w=>`<div style="margin:4px 0">${w.t}<br><label class="row" style="gap:6px;margin-top:4px"><input type="checkbox" data-ok="${w.k}"> <b>${w.ok}</b></label></div>`).join('')}</div>`; $('#sv',b).textContent='Conferma e salva'; }
          m.textContent='Controlla gli avvisi qui sopra: per andare avanti spunta le conferme.'; return; } }
      if(nuovo){ S.recipienti.push({id:'c_'+uid(),codice,cap,capOp,tipo,note,gruppo,posto,locale:c.locale,stato:'attivo',x:null,y:null,creato:new Date().toISOString()}); close(); refresh(); toast((tipo.charAt(0).toUpperCase()+tipo.slice(1))+' '+codice+' aggiunt'+(['tonneau'].includes(tipo)?'o':'a')); return; }
      const ret=[]; if(usato){ if(String(c.codice)!==codice) ret.push({campo:'codice',da:String(c.codice),a:codice}); if(+c.cap!==cap) ret.push({campo:'capacità',da:nf(c.cap)+' hL',a:nf(cap)+' hL'}); }
      if(ret.length) c.rettifiche=(c.rettifiche||[]).concat(ret.map(r=>({...r,data:today()})));
      Object.assign(c,{codice,cap,capOp,tipo,note,gruppo,posto});
      close(); refresh(); toast(ret.length?'Correzione annotata':'Contenitore salvato'); };
  });
}

function anControlli(valori,vid,data){

    for(const a of prev){ for(const k of ['Zuccheri riduttori totali','Glucosio + Fruttosio']){ const x=(a.valori||{})[k]; if(x&&!x.lod&&x.v!=null){ zuc=x.v; break; } } if(zuc!=null) break; } }
  const unita={};
  const so2u=k=>{ const v=val(k); if(v!=null&&v>0&&v<1){ unita[keyOf(k)]=1; warn.push({k:'u:'+k,p:keyOf(k),t:`<b>${esc(k)} ${nfl(v)}</b> mg/L: sembra scritta in g/L. In mg/L sarebbe ${nf(v*1000,0)}.`}); } };
  so2u('Solforosa totale'); so2u('Solforosa libera');
  { const v=val('Acidità totale'); if(v!=null&&v>100){ unita[keyOf('Acidità totale')]=1; warn.push({k:'u:at',p:keyOf('Acidità totale'),t:`<b>Acidità totale ${nfl(v)}</b> g/L: sembra scritta in mg/L. In g/L sarebbe ${nf(v/1000,2)}.`}); } }
  { const v=val('Acidità volatile'); if(v!=null&&v>20){ unita[keyOf('Acidità volatile')]=1; warn.push({k:'u:av',p:keyOf('Acidità volatile'),t:`<b>Acidità volatile ${nfl(v)}</b> g/L: sembra scritta in mg/L. In g/L sarebbe ${nf(v/1000,2)}.`}); } }
  Object.entries(valori).forEach(([p,x])=>{ if(!x||x.lod||x.v==null) return;
    if(x.v<0){ neg.push(p); return; }
    if(unita[p]) return; const l=limOf(p); if(!l) return;
    let mn=l.min, mx=l.max, nota='';
    if(l.so2){ const dolce=zuc!=null&&zuc>=5; const base=w.tipo==='rosso'?(l.maxRosso!=null?l.maxRosso:l.max):l.max; if(base!=null){ mx=base+(dolce?50:0); nota=` (limite per ${w.tipo==='rosso'?'un vino rosso':'un vino bianco o rosato'}${dolce?' con zuccheri da 5 g/L in su':' secco'})`; } }
    if((mn!=null&&x.v<mn)||(mx!=null&&x.v>mx)) warn.push({k:'r:'+p,p,t:`<b>${esc(p)} ${nfl(x.v)}</b>: fuori dall'intervallo consueto ${mn!=null?nfl(mn):'…'} – ${mx!=null?nfl(mx):'…'}${nota}.`}); });
  { const L=val('Solforosa libera'), T=val('Solforosa totale'); if(L!=null&&T!=null&&L>T) warn.push({k:'c:so2',p:keyOf('Solforosa libera'),t:`<b>Solforosa libera ${nfl(L)}</b> maggiore della <b>totale ${nfl(T)}</b>: la libera è una parte della totale.`}); }
  { const A=val('Alcool distillazione','Alcol svolto'), Z=val('Zuccheri riduttori totali','Glucosio + Fruttosio');
    if(A!=null&&Z!=null){ const pot=A+Z/16.8; if(pot>20) warn.push({k:'c:pot',p:keyOf('Alcool distillazione')||keyOf('Alcol svolto'),t:`Alcol potenziale totale <b>${nf(pot,1)} % vol</b> (alcol ${nfl(A)} + zuccheri ${nfl(Z)} g/L ÷ 16,8): oltre il 20 % vol.`}); } }
  warn.forEach(x=>{ const d=document.createElement('div'); d.innerHTML=x.t; x.txt=d.textContent; });

/* conferma degli avvisi analitici dentro un modulo: false = fermati */
function anGate(box,msgEl,btn,label){ let key='';

  return {reset, check(ck,onLod){
    if(ck.neg.length){ key=''; if(btn) btn.textContent=label;
      box.innerHTML=`<div class="box warn small" style="margin:8px 0;color:var(--ink)"><b>Valori negativi:</b> ${ck.neg.map(esc).join(', ')}. Un valore strumentale negativo di solito significa «sotto il limite di rilevabilità»: si registra come «&lt; LR», non come numero. <button type="button" class="btn sm" data-anlod>Registra come «sotto il limite»</button></div>`;

      if(btn) btn.textContent='Conferma e salva'; msgEl.textContent='Controlla gli avvisi: per salvare spunta le conferme oppure correggi i valori.'; return false; }
    if([...box.querySelectorAll('[data-anok]')].some(x=>!x.checked)){ msgEl.textContent='Spunta tutte le conferme per andare avanti, oppure correggi i valori.'; return false; }
    return true; }}; }
const anSegna = (o,ck)=>{ if(!ck.warn.length){ delete o.controlli; return; } ck.warn.forEach(w=>{ if(w.p&&o.valori[w.p]) o.valori[w.p].fl=true; }); o.controlli={il:new Date().toISOString(),avvisi:ck.warn.map(w=>w.txt)}; };
const negALod = root=>$$('[data-p]',root).forEach(i=>{ const t=i.value.trim(); if(t.startsWith('<')) return; const n=num(t); if(n!=null&&n<0) i.value='<'; });

function limitiBind(app){ const b=$('#lm-b',app); if(!b) return;

/* ===================== Quantità da verificare (REG-INV-03) =====================
   Eccedenze confermate (REG-TRAV-09) e differenze dei travasi lasciate «da verificare» (REG-TRAV-06/07, REG-FEC-01):
   restano in Inventario → Differenze aperte finché non vengono chiuse con un esito. La chiusura non cambia i volumi. */
const verifiche = ()=>(S.verifiche=S.verifiche||{});
const VER_ESITI={stima:'Errore di stima dei volumi: nessuna rettifica',misura:'Controllata con una misura',perdita:'Era una perdita',altro:'Altro'};
function anomalieQta(){ const out=[]; const evOf=id=>S.eventi.find(e=>e.id===id);
  Object.entries(RA.ecc||{}).forEach(([k,x])=>{ const e=evOf(k.slice(0,k.lastIndexOf('_'))); if(!e) return;
    out.push({key:'ecc:'+k,ev:e,vasca:x.vasca,L:x.L,cosa:e.tipo==='imbottigliamento'?'Imbottigliati più litri di quelli presenti: vasca considerata vuota':'Usciti più litri di quelli presenti: vasca considerata vuota'}); });
  attivi(S.eventi).forEach(e=>(e.tratte||[]).forEach((t,i)=>{ const dc=(RA.diffCalc||{})[e.id+'_'+i];
    if(t.svuota&&dc){ if(dc.calc<-1e-6) out.push({key:'arr:'+e.id+'_'+i,ev:e,vasca:t.da,L:-dc.calc,cosa:`Arrivati nella ${vnome(t.a)} più litri del teorico della vasca svuotata`});
      const ver=(t.diffTipo||'verificare')==='verificare'?Math.max(dc.cls||0,0):0, tot=ver+(dc.resto>1e-6?dc.resto:0);
      if(tot>1e-6) out.push({key:'ver:'+e.id+'_'+i,ev:e,vasca:t.da,L:tot,cosa:'Differenza del travaso con vasca svuotata, lasciata da verificare'}); }
    else if(!t.svuota&&t.diffL>1e-6&&t.diffTipo==='verificare') out.push({key:'ver:'+e.id+'_'+i,ev:e,vasca:t.da,L:t.diffL,cosa:'Uscita in più dalla vasca di partenza, lasciata da verificare'}); }));
  attivi(S.eventi).forEach(e=>(e.perdite||[]).forEach((p,k)=>{ if(p.tipo!=='verificare') return; const L=((RA.diffCalc||{})[e.id+'_p'+k]||{}).calc; if(L>1e-6) out.push({key:'ver:'+e.id+'_p'+k,ev:e,vasca:p.vasca,L,cosa:'Perdita in una lavorazione senza movimento, lasciata da verificare'}); }));

     <td class="r" style="white-space:nowrap">${chiuse?`<button class="btn sm ghost" data-vreo="${esc(x.key)}">Riapri</button>`:`<button class="btn sm pri" data-vchi="${esc(x.key)}">Chiudi…</button>${['lavorazione','imbottigliamento'].includes(x.ev.tipo)?` <button class="btn sm" data-vcor="${esc(x.ev.id)}">Correggi operazione</button>`:''} <button class="btn sm" data-act="misura" data-v="${esc(x.vasca)}">Misura</button>`}</td></tr>`; VLAB_D=null; return r; }).join('')}</tbody></table></div>`; }

/* ===================== Barrique raggruppate sulla pianta (REG-PLAN-07) =====================
   Nei locali con almeno 6 barrique (o tonneau) la pianta non le disegna una per una: mostra un'icona per fila

const GRP_TIPI=['barrique','tonneau'], GRP_MIN=6, GRP_W=132, GRP_H=74;
const grpTipiDi = dep=>{ const c={}; VASCHE.forEach(v=>{ if(v.dep===dep&&v.stato==='attivo'&&GRP_TIPI.includes(v.tipo)) c[v.tipo]=(c[v.tipo]||0)+1; }); return Object.keys(c).filter(t=>c[t]>=GRP_MIN); };
const grpAttivo = dep=>!((LOCMAP[dep]||{}).grpOff);

async function scaricaBackup(){ const nome=('backup-'+azNome()+'-'+today()).replace(/[^\w\-. àèéìòù]/g,'').replace(/\s+/g,'_')+'.json';
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); let dl=null;
  try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){ dl=null; }
  if(dl){ try{ await dl.save({filename:nome,data:blob}); bkSegna('scaricato'); toast('Backup scaricato: '+nome); route(); return true; }catch(e){ if(e&&e.code==='declined'){ toast('Download annullato'); return false; } toast('Download non riuscito: usa «Copia backup»'); return false; } }
  try{ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=nome; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); bkSegna('scaricato'); toast('Backup scaricato: '+nome); route(); return true; }

/* ===================== Totali: vino e fecce separati ===================== */
const isFecceV = vid=>!!(vino(vid)||{}).fecce;
/* testo «412 hL di vino · fecce 6,3 hL» a partire da un elenco di codici contenitore */
function totVinoFecce(codes,st){ st=st||R.st; let V=0,F=0; codes.forEach(c=>{ const s=st[c]; if(!s||!s.vino||!(s.L>0)) return; if(isFecceV(s.vino)) F+=s.L; else V+=s.L; });
  return {V,F,txt:hL(V)+(F>1e-6?' di vino · fecce '+hL(F)+' <span class="muted">(≈ '+nf(F*KG_L,0)+' kg)</span>':'')}; }

/* ===================== Aggiunte collettive: quota del contenitore ===================== */
/* ctx = {Lv: litri nel contenitore, n: contenitori trattati insieme, Ltot: litri trattati in tutto} */
function aggQuota(a,ctx){
  if(!ctx||a.vasca||!(ctx.n>1)||!(ctx.Lv>0)) return '';
  const tutto=/ in tutto$/.test(a.udm||''); const Ltot=a.volL||ctx.Ltot;
  let q=null;
  if(tutto){ if(a.dose==null||!(Ltot>0)) return ''; const u=a.udm.replace(' in tutto',''); const v=a.dose*Math.min(1,ctx.Lv/Ltot); q='≈ '+nf(v,v<10?2:1)+' '+u; }
  else { const t=qtaTeorica(a.dose,a.udm,ctx.Lv,a.prodotto); if(!t) return ''; q=t; }
  const tot=tutto?qtaTeorica(a.dose,a.udm,0,a.prodotto):(Ltot?qtaTeorica(a.dose,a.udm,Ltot,a.prodotto):null);
  return ` <span class="muted">(${q} in questo contenitore${tutto?', stima in proporzione ai litri':''} · ${tot?tot+' in tutto ':''}su ${ctx.n} contenitori)</span>`; }
function aggLineCtx(list,ctx){ if(!list||!list.length) return ''; if(!ctx||!(ctx.n>1)) return aggLine(list);
  return 'Aggiunte: '+list.map(a=>{ const qz=aggQuota(a,ctx); if(!qz) return aggLine([a]).replace(/^Aggiunte: /,'');
    return `<b>${esc(a.prodotto)}</b> ${a.dose!=null?nf(a.dose,3):''} ${esc(a.udm||'')}${qz}${a.reale?` · usata ${esc(a.reale)}`:''}`; }).join(' · '); }

/* ===================== Elenchi a tendina che si riaprono sempre completi ===================== */
/* Sostituisce il comportamento dei <datalist> del browser (che mostrano solo le voci che iniziano come il testo già scritto):
   la freccia riapre sempre tutto l'elenco; scrivendo, l'elenco si restringe. Il campo resta un normale campo di testo. */
(function(){
  let pop=null, cur=null, items=[], hi=-1;
  const close=()=>{ if(pop){ pop.remove(); pop=null; } cur=null; hi=-1; };
  const opts=inp=>{ const dl=document.getElementById(inp.dataset.combo); return dl?[...dl.options].map(o=>({v:o.value,l:o.label&&o.label!==o.value?o.label:(o.textContent||'').trim()!==o.value?(o.textContent||'').trim():''})).filter(o=>o.v):[]; };
  function open(inp,all){ close(); cur=inp; const q=all?'':inp.value.trim().toLowerCase();
    items=opts(inp).filter(o=>!q||o.v.toLowerCase().includes(q)||(o.l||'').toLowerCase().includes(q)); if(!items.length) return;
    pop=document.createElement('div'); pop.className='cb-pop'; pop.setAttribute('role','listbox');
    pop.innerHTML=items.map((o,i)=>`<div class="cb-it${o.v===inp.value?' on':''}" role="option" data-i="${i}">${esc(o.v)}${o.l?` <span class="muted small">${esc(o.l)}</span>`:''}</div>`).join('');
    document.body.appendChild(pop); place();
    hi=items.findIndex(o=>o.v===inp.value); if(hi>=0){ const el=pop.children[hi]; el.scrollIntoView({block:'nearest'}); }
    pop.addEventListener('mousedown',e=>{ e.preventDefault(); const it=e.target.closest('.cb-it'); if(it) scegli(+it.dataset.i); }); }
  function place(){ if(!pop||!cur) return; const r=cur.getBoundingClientRect(); const below=window.innerHeight-r.bottom;
    pop.style.left=Math.max(4,r.left)+'px'; pop.style.minWidth=r.width+'px'; pop.style.maxWidth=Math.max(r.width,320)+'px';
    if(below<200&&r.top>below){ pop.style.top=''; pop.style.bottom=(window.innerHeight-r.top+2)+'px'; pop.style.maxHeight=Math.min(280,r.top-8)+'px'; }
    else { pop.style.bottom=''; pop.style.top=(r.bottom+2)+'px'; pop.style.maxHeight=Math.min(280,below-8)+'px'; } }
  function scegli(i){ const inp=cur, o=items[i]; if(!inp||!o) return; inp.value=o.v; close();
    inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); }
  function evid(i){ if(!pop) return; hi=Math.max(0,Math.min(items.length-1,i)); [...pop.children].forEach((c,k)=>c.classList.toggle('hi',k===hi)); pop.children[hi].scrollIntoView({block:'nearest'}); }
  function migliora(inp){ if(inp.dataset.combo) return; const id=inp.getAttribute('list'); if(!id) return;
    inp.dataset.combo=id; inp.removeAttribute('list'); inp.setAttribute('autocomplete','off'); inp.classList.add('cb-in');
    const w=document.createElement('span'); w.className='cb-w'; inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const bt=document.createElement('button'); bt.type='button'; bt.className='cb-bt'; bt.tabIndex=-1; bt.setAttribute('aria-label','Mostra tutto l\'elenco'); bt.innerHTML='▾'; w.appendChild(bt);
    bt.addEventListener('mousedown',e=>e.preventDefault());
    bt.addEventListener('click',()=>{ if(cur===inp&&pop) close(); else { inp.focus(); open(inp,true); } });
    inp.addEventListener('input',e=>{ if(e.isTrusted) open(inp,false); });
    inp.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); if(!pop||cur!==inp) open(inp,true); else evid(hi+1); }
      else if(e.key==='ArrowUp'&&pop){ e.preventDefault(); evid(hi-1); }
      else if(e.key==='Enter'&&pop&&cur===inp&&hi>=0){ e.preventDefault(); scegli(hi); }
      else if(e.key==='Escape'&&pop){ e.stopPropagation(); close(); } });
    inp.addEventListener('blur',()=>setTimeout(()=>{ if(cur===inp&&document.activeElement!==inp) close(); },120)); }
  const scan=root=>{ if(root.querySelectorAll) root.querySelectorAll('input[list]').forEach(migliora); };
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches&&n.matches('input[list]')) migliora(n); scan(n); } }))).observe(document.body,{childList:true,subtree:true});
  scan(document.body);
  window.addEventListener('scroll',()=>place(),true); window.addEventListener('resize',close);
  document.addEventListener('mousedown',e=>{ if(pop&&!e.target.closest('.cb-pop')&&!e.target.closest('.cb-w')) close(); });
})();

    const calc=()=>{ const t=$('#sc-t',b).value, f=$('#sc-f',b).value, q=$('#sc-q',b).value, m=$('#sc-m',b).value, x=num($('#sc-x',b).value), nMax=Math.floor(num($('#sc-n',b).value)||0);
      $('#sc-xl',b).textContent=m==='uguale'?'hL in ciascuno':m==='cap'?'Totale da distribuire (hL, facoltativo)':'Totale da distribuire (hL)';
      let vs=base().filter(v=>(!t||v.tipo===t)&&(!f||v.rec.gruppo===f)&&(q==='tutti'||!(st[v.code].L>1e-6))).sort((a,c)=>natCmp(a.rec.gruppo||'',c.rec.gruppo||'')||natCmp(a.rec.posto||a.label,c.rec.posto||c.label)||natCmp(a.label,c.label));
      const scelti=vs.filter(v=>!tolti.has(v.code)).slice(0,nMax||Infinity);
      $('#sc-g',b).innerHTML=vs.map(v=>{ const s=st[v.code]; const pieno=s.L>1e-6; const ff=pieno?Math.min(1,s.L/(v.cap*100)):0;
        return `<button type="button" class="fpost${scelti.includes(v)?' sel':''}" data-sc="${esc(v.code)}" style="--pc:${pieno?partCol(s.vino):'transparent'};--pf:${(ff*100).toFixed(0)}%" title="${esc(vlab(v.code))} · ${nf(v.cap)} hL${pieno?' · contiene '+esc(vName(s.vino))+' '+hL(s.L):''}"><b>${esc(v.label)}</b><span>${nf(v.cap)} hL</span></button>`; }).join('')||'<span class="muted small">Nessun contenitore con queste scelte.</span>';
      $$('[data-sc]',b).forEach(x=>x.onclick=()=>{ const c=x.dataset.sc; tolti.has(c)?tolti.delete(c):tolti.add(c); calc(); });
      let out=[]; const libero=v=>Math.max(0,v.cap*100-(st[v.code].L||0));
      if(m==='cap'){ let rest=x>0?x*100:Infinity; for(const v of scelti){ if(rest<1e-6) break; const L=Math.min(libero(v),rest); if(L<1e-6) continue; out.push([v.code,L]); rest-=L; } }
      else if(m==='uguale'){ if(x>0) scelti.forEach(v=>out.push([v.code,x*100])); }
      else if(x>0&&scelti.length){ if(m==='totale') scelti.forEach(v=>out.push([v.code,x*100/scelti.length])); else { const cT=scelti.reduce((a,v)=>a+v.cap,0); scelti.forEach(v=>out.push([v.code,x*100*v.cap/cT])); } }
      out=out.map(([c,L])=>[c,Math.round(L*10)/10]);
      const tot=out.reduce((a,r)=>a+r[1],0); const oltre=out.filter(([c,L])=>(st[c].L||0)+L>VMAP[c].cap*100+1e-6);
      $('#sc-p',b).innerHTML=out.length?`<b>${out.length}</b> contenitor${out.length>1?'i':'e'} · in tutto <b>${hL(tot)}</b>${m==='cap'&&x>0&&tot<x*100-1e-6?` <span style="color:var(--warn)">(ci stanno solo ${hL(tot)} dei ${hL(x*100)} indicati)</span>`:''}${oltre.length?`<br><span style="color:var(--warn)">${oltre.length} oltre la nominale: ${esc(oltre.map(r=>vlab(r[0])).join(', '))}</span>`:''}`:(scelti.length?'Indica la quantità.':'Nessun contenitore scelto.');
      $('#sc-ok',b).disabled=!out.length; return out; };
    $('#sc-l',b).onchange=()=>{ tolti=new Set(); $('#sc-t',b).value=''; fil(); calc(); };
    $('#sc-t',b).onchange=()=>{ tolti=new Set(); fil(); calc(); }; $('#sc-f',b).onchange=()=>{ tolti=new Set(); calc(); };
    $('#sc-all',b).onclick=()=>{ tolti=new Set(); calc(); }; $('#sc-none',b).onclick=()=>{ $$('[data-sc]',b).forEach(x=>tolti.add(x.dataset.sc)); calc(); };
    ['#sc-q','#sc-m'].forEach(s=>$(s,b).onchange=calc); ['#sc-x','#sc-n'].forEach(s=>$(s,b).oninput=calc);
    fil(); calc();
    $('#sc-ok',b).onclick=()=>{ const out=calc(); if(!out.length) return; close(); o.aggiungi(out); }; }); }

/* ===================== Oltre la capacità nominale: avviso confermabile (contenuto risultante) ===================== */
function oltreNominale(arrivi,st){ /* arrivi: {code: litri in arrivo (netti)} → [{code,L0,L1,cap}] */
  return Object.entries(arrivi).filter(([c,dL])=>VMAP[c]&&dL>1e-6).map(([c,dL])=>{ const L0=Math.max(0,(st[c]||{}).L||0); return {code:c,L0,L1:L0+dL,cap:VMAP[c].cap*100}; }).filter(x=>x.L1>x.cap+1e-6); }
const oltreTxt = x=>`<b>${esc(vlab(x.code))}</b>: ${x.L0>1e-6?`contiene ${hL(x.L0)}, `:''}con questa operazione arriva a <b>${hL(x.L1)}</b> su ${hL(x.cap)} nominali (${hL(x.L1-x.cap)} oltre).`;

/* ===================== Codici uguali in locali diversi: mai due nomi uguali a video ===================== */
var _conflK=null, _confl=null;
function codiciDoppi(){ const k=(typeof R!=='undefined'?R:null); if(_conflK===k&&_confl) return _confl; const by={};
  VASCHE.forEach(v=>{ if(v.stato!=='attivo') return; const l=LOCMAP[v.dep]; if(!l||l.stato==='disattivo'||l.stato==='rimosso') return; const c=v.label.toLowerCase(); (by[c]=by[c]||new Set()).add(v.dep); });
  const out=new Set(Object.entries(by).filter(([,s])=>s.size>1).map(([c])=>c)); _conflK=k; _confl=out; return out; }
const locPrincipale = ()=>(DEPOSITI.find(l=>l.stato!=='disattivo'&&l.stato!=='rimosso')||DEPOSITI[0]||{}).id;
/* prefisso a video: la sigla del locale; se manca e il codice esiste anche in un altro locale, il nome del locale (tranne il locale principale) */
function prefLoc(dep,label){ const l=LOCMAP[dep]||{}; if(l.sigla) return l.sigla; if(dep!==locPrincipale()&&codiciDoppi().has(String(label).toLowerCase())) return l.nome||''; return ''; }
const siglaProposta = nome=>{ const w=String(nome||'').split(/[\s–—\-·,]+/).filter(x=>x&&!/^(di|del|della|la|il|lo|le|cantina|locale)$/i.test(x)); const s=(w[w.length-1]||nome||'').trim(); return s.charAt(0).toUpperCase()+s.slice(1,10); };
function doppiDi(dep){ const D=codiciDoppi(); return VASCHE.filter(v=>v.dep===dep&&v.stato==='attivo'&&D.has(v.label.toLowerCase())); }

/* ===================== Menu dei contenitori: prima il locale, poi il contenitore ===================== */
(function(){
  const SOGLIA=6;
  const depDi=v=>VMAP[v]?VMAP[v].dep:null;
  function predefinito(sel,deps){ if(sel.value&&depDi(sel.value)) return depDi(sel.value);
    const blk=sel.closest('.blk'); if(blk){ const da=blk.querySelector('.t-da'); if(da&&da!==sel&&depDi(da.value)) return depDi(da.value); }
    const form=sel.closest('form'); if(form){ const altro=[...form.querySelectorAll('select[data-locp]')].map(s=>s._loc&&s._loc.value).find(Boolean); if(altro) return altro; }
    return deps.includes(UI.dep)?UI.dep:deps[0]; }
  function rendi(sel){ const loc=sel._loc.value; const cur=sel.value; sel._busy=true;
    sel.innerHTML=''; sel._tutte.forEach(o=>{ const d=depDi(o.value); if(d&&d!==loc&&o.value!==cur) return; const op=document.createElement('option'); op.value=o.value;
      /* il locale è già scritto nel menu sopra: nel nome del contenitore non si ripete */
      let t=o.text; if(d===loc){ const pf=prefLoc(d,VMAP[o.value].label); if(pf&&t.startsWith(pf+' ')) t=t.slice(pf.length+1); } op.textContent=t; if(o.dis) op.disabled=true; sel.appendChild(op); });
    sel.value=cur; if(sel.value!==cur) sel.value=''; sel._sig=[...sel.options].map(o=>o.value).join('|'); sel._busy=false; }
  function migliora(sel){ if(sel._busy) return; if(sel._loc&&sel._sig&&sel._sig===[...sel.options].map(o=>o.value).join('|')) return; const opts=[...sel.options].map(o=>({value:o.value,text:o.textContent,dis:o.disabled}));
    const deps=[...new Set(opts.map(o=>depDi(o.value)).filter(Boolean))].sort((a,b)=>DEPOSITI.findIndex(l=>l.id===a)-DEPOSITI.findIndex(l=>l.id===b));
    const nCont=opts.filter(o=>depDi(o.value)).length;
    if(deps.length<2||nCont<SOGLIA){ if(sel._loc){ sel._loc.remove(); sel._loc=null; } return; }
    sel._tutte=opts; sel.dataset.locp='1';
    if(!sel._loc){ const l=document.createElement('select'); l.className='loc-pick'; l.setAttribute('aria-label','Locale'); l.title='Locale: cambia se il contenitore è in un altro locale';
      const w=document.createElement('span'); w.className='lp-w'; sel.parentNode.insertBefore(w,sel); w.appendChild(l); sel._busy=true; w.appendChild(sel); sel._busy=false; sel._loc=l; sel.classList.add('cont-pick');
      l.addEventListener('change',()=>{ const prima=sel.value; rendi(sel); if(sel.value!==prima) sel.dispatchEvent(new Event('change',{bubbles:true})); }); }
    const scelto=sel._loc.value&&deps.includes(sel._loc.value)?sel._loc.value:predefinito(sel,deps);
    const cur=sel.value; const curDep=depDi(cur);
    sel._loc.innerHTML=deps.map(d=>`<option value="${esc(d)}">${esc(locNome(d))}</option>`).join('');
    sel._loc.value=curDep||scelto; rendi(sel); }
  const scan=root=>{ if(!root.querySelectorAll) return; root.querySelectorAll('select').forEach(s=>{ if(!s.classList.contains('loc-pick')) migliora(s); }); };
  new MutationObserver(ms=>{ const fatti=new Set(); ms.forEach(m=>{ const t=m.target;
      if(t.tagName==='SELECT'&&!t._busy&&!t.classList.contains('loc-pick')){ if(!fatti.has(t)){ fatti.add(t); if(t._sig!==[...t.options].map(o=>o.value).join('|')) migliora(t); } return; }
      m.addedNodes.forEach(n=>{ if(n.nodeType!==1) return; if(n.tagName==='SELECT'){ if(!n.classList.contains('loc-pick')) migliora(n); } else if(n.tagName!=='OPTION') scan(n); }); }); })
    .observe(document.body,{childList:true,subtree:true});
  /* nei travasi: cambiando la vasca di partenza, le destinazioni ancora vuote seguono il suo locale */
  document.addEventListener('change',e=>{ const t=e.target; if(!t.matches||!t.matches('.t-da')) return; const d=depDi(t.value); if(!d) return; const blk=t.closest('.blk'); if(!blk) return;
    blk.querySelectorAll('.t-a').forEach(s=>{ if(!s.value&&s._loc&&[...s._loc.options].some(o=>o.value===d)&&s._loc.value!==d){ s._loc.value=d; rendi(s); } }); },true);
})();

route();
</script>
