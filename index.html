  --c1:#7B2240; --c2:#2F6E9A; --c3:#C0802A; --c4:#4F8A55; --c5:#7E62A8; --c6:#9AA3A0;

  --bianco:#CFAA3A; --rosato:#E48E9C; --rosso:#B4486A; --fecce:#A69580; --wood:#C08A55; --man:#5BA9D0;
  --warn:#E8AE52; --warn-bg:#3A2C12; --ok:#62BD90; --ok-bg:#163126; --hand:#4A3F12; --danger:#EE7B7F; --danger-bg:#3D1A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131716; --surface:#1B201F; --surface-2:#222827; --ink:#E5E9E6; --muted:#9BA4A0; --line:#323A38;
  --accent:#DB7894; --accent-ink:#1B0A10; --steel:#7A8689;

<style id="ui2">

  --bg:#ECEEEB; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#18201D; --muted:#5B6560; --line:#DDE1DC;

function puliziaSchedeVecchie(){

  else return false;
  if(!old.length){ save(); return false; }
  const ids=new Set(old.map(v=>v.id));
  S.analisi=S.analisi.filter(a=>!ids.has(a.vino));
  const onlyOld=e=>{ const set=RA.evVini[e.id]; return set&&set.size&&[...set].every(x=>ids.has(x)); };
  S.eventi=S.eventi.filter(e=>!(e.tipo==='carico'&&ids.has(e.vino))&&!(e.storico&&(e.vini||[]).every(x=>ids.has(x)))&&!onlyOld(e));
  S.vini=S.vini.filter(v=>!ids.has(v.id)&&!(v.fecceDi&&ids.has(v.fecceDi)&&vinoTot(v.id).L<1e-6));

  const rows=Object.entries(G.compo).filter(([,f])=>f>1e-9).sort((a,b)=>{const ao=a[0].startsWith('own:'),bo=b[0].startsWith('own:'); return ao!==bo?(ao?-1:1):b[1]-a[1];});
  const ownN=Object.keys(G.compo).filter(k=>k.startsWith('own:')).length;
  const label=k=>{ if(k.startsWith('own:')){ const n=R.nodes[k.slice(4)]; const ot=origTxt(n); return `<b>${esc(vName(G.root.vino))}</b> <span class="muted">— ${ownN>1?'partita':'partita propria'}${ot?' · '+esc(ot):''}${ownN>1?` · entrata in vasca ${esc(vlab(n.vasca))} il ${fd(n.data)}`:''}</span>`; }
    if(G.mode==='op'){ const bd=G.bounds[k]; return `<b>${esc(vName(bd.p.vino))}</b> <span class="muted">— ${bd.p.leaf?esc(lc1(bd.p.descr)):'dalla '+esc(vnome(bd.p.vasca))} in ${esc(vnome(bd.child.vasca))} il ${fd(R.nodes[bd.child.id].data)}</span>`; }
    const n=R.nodes[k]; return `<b>${esc(vName(n.vino))}</b> <span class="muted">— ${esc(lc1(n.descr))} in vasca ${esc(vlab(n.vasca))} il ${fd(n.data)}</span>`; };
  return `<div class="cbar">${rows.map(([k,f],j)=>`<i style="width:${f*100}%;background:${cols[j%cols.length]}"></i>`).join('')}</div>
   <ul class="clist">${rows.map(([k,f],j)=>`<li><span class="sw" style="background:${cols[j%cols.length]}"></span><b>${nf(f*100,1)}%</b> · ${hL(f*Ltot)} · ${label(k)}${btn&&G.mode==='op'?histBtn(G,k):''}</li>`).join('')}</ul>`;
}
function histBtn(G,k){ const B=(p,c,L)=>` <button class="btn sm ghost" data-focus="${p}>${c}" data-l="${L}">storia di questa porzione</button>`;
  if(k.startsWith('own:')){ const id=k.slice(4); if(G.ownJoin[id]){ const j=G.ownJoin[id]; return B(j.p,j.c,j.L); }
    if(Object.keys(G.compo).filter(x=>x.startsWith('own:')).length<2&&!Object.keys(G.compo).some(x=>!x.startsWith('own:'))) return '';
    const c=G.lin.find(n=>!n.leaf&&n.parents.some(p=>p.n===id)); if(c){ const pe=c.parents.find(p=>p.n===id); return B(id,c.id,pe.L); } return ''; }
  const bd=G.bounds[k]; return bd?B(bd.p.id,bd.child.id,bd.L):''; }
function analisiPercorso(G,code,focus){
  const lin=G.lin.filter(n=>!n.leaf); if(!lin.length) return '';
  const endDate=i=>i===Infinity?'9999-12-31':(R.idxDate[i]||'9999-12-31');
  const rootVini=new Set(lin.map(n=>n.vino)); const lastDate=focus?endDate(R.nodes[focus.c].i):'9999-12-31';
  const rows=[];
  S.analisi.forEach(a=>{ if(!rootVini.has(a.vino)) return;
    if(a.ambito!=='vasca'){ if(a.data<=lastDate) rows.push({a,perc:focus?'tutto il vino (prima dell\'unione)':'tutto il vino'}); return; }
    const hit=lin.filter(n=>n.vino===a.vino&&anVasche(a).includes(n.vasca)&&a.data>=n.data&&a.data<=endDate(G.ends[n.id]));
    if(!hit.length) return;
    const n=hit[0]; const here=!focus&&n.vasca===code&&G.ends[n.id]===Infinity;
    rows.push({a,perc:here?'questa vasca':(n.vasca===code&&!focus?'questa vasca, prima dell\'unione':`porzione in vasca ${esc(vlab(n.vasca))}${G.ends[n.id]===Infinity?'':', prima di confluire'}`),share:G.w[n.id]}); });
  if(!rows.length) return '';
  rows.sort((x,y)=>x.a.data<y.a.data?1:-1);
  const K=['Alcool distillazione','Acidità totale','Acidità volatile','pH','Solforosa libera','Solforosa totale'];
  const vlink=[...rootVini][0];
  return `<div class="panel"><div class="spread"><h3>Analisi lungo il percorso</h3><a class="small" href="#vino-${vlink}" id="g-an">tabella completa →</a></div>
   <p class="hint">Analisi del vino seguito: quelle di tutto il vino e quelle fatte sulle vasche in cui si trovava, nel periodo in cui c'era. Le analisi di altre partite entrate per assemblaggio si vedono con «storia di questa porzione».</p>
   <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Riferita a</th><th>Pertinenza</th>${K.map(k=>`<th class="r">${esc(k.replace('Alcool distillazione','Alcol').replace('Solforosa','SO₂'))}</th>`).join('')}<th></th></tr></thead><tbody>
   ${rows.map(({a,perc,share})=>`<tr><td>${fd(a.data)}</td><td>${esc(anAmbitoTxt(a))}${a.lab?' · '+esc(a.lab):''}</td><td class="small">${perc}${share!=null&&share<0.999?` <span class="chip warn">${nf(share*100,0)}% del vino ${focus?'della porzione':'attuale'}</span>`:''}</td>${K.map(k=>`<td class="r">${fmtVal(a.valori[k])||'<span class="muted">·</span>'}</td>`).join('')}<td class="r"><button type="button" class="btn sm ghost" data-paed="${esc(a.id)}" data-pav="${esc(a.vino)}">Correggi</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
const KEST=['Alcool distillazione','Zuccheri riduttori totali','Glucosio + Fruttosio','Acidità totale','Acidità volatile','pH','Acido malico','Acido lattico','Acido tartarico','Estratto totale','Solforosa libera','Solforosa totale'];
function stimaTaglio(rootId,refDate){
  refDate=refDate||asOf(); const sup={}; Object.values(R.nodes).forEach(c=>c.parents.forEach(p=>{ const P=R.nodes[p.n]; if(P&&P.vasca===c.vasca&&!c.leaf){ if(sup[p.n]==null||c.i<sup[p.n]) sup[p.n]=c.i; } }));
  const endD=n=>sup[n.id]!=null?(R.idxDate[sup[n.id]]||'9999-12-31'):'9999-12-31';
  const measured=n=>S.analisi.filter(a=>a.vino===n.vino&&a.data>=n.data&&a.data<=endD(n)&&a.data<=refDate&&(a.ambito!=='vasca'||anVasche(a).includes(n.vasca))).sort((x,y)=>x.data<y.data?1:-1);
  const memo={};
  const est=id=>{ if(memo[id]) return memo[id]; const n=R.nodes[id]; let r={vals:{},cov:{},fonti:[]};
    if(!n||n.leaf){ return memo[id]=r; }
    const m=measured(n);
    if(m.length){ KEST.forEach(k=>{ const a=m.find(a=>a.valori[k]&&a.valori[k].v!=null&&!a.valori[k].lod); if(a){ r.vals[k]=a.valori[k].v; r.cov[k]=1; } }); r.fonti=[{tipo:'misurata',n,an:m[0].id,data:m[0].data,vasca:n.vasca,vino:n.vino}]; if(Object.keys(r.vals).length) return memo[id]=r; }
    const tot=n.parents.reduce((s2,p)=>s2+p.L,0)||1;
    n.parents.forEach(p=>{ const e=est(p.n); r.fonti.push(...e.fonti.map(f=>({...f,quota:(f.quota??1)*p.L/tot})));
      KEST.forEach(k=>{ if(e.vals[k]==null) return; const w=p.L*(e.cov[k]||0); r.vals[k]=(r.vals[k]||0)+e.vals[k]*w; r.cov[k]=(r.cov[k]||0)+w; }); });
    KEST.forEach(k=>{ if(r.cov[k]){ r.vals[k]=r.vals[k]/r.cov[k]; r.cov[k]=r.cov[k]/tot; } });
    return memo[id]=r; };
  const n=R.nodes[rootId]; if(!n) return null; const direct=measured(n);
  const r=est(rootId); return {direct:direct[0]||null,stima:r,isMix:n.parents.length>1||n.parents.some(p=>{const P=R.nodes[p.n];return P&&!P.leaf&&P.parents.length>1;})};
}
function stimaHTML(code){
  const s0=R.st[code]; if(!s0.node||(vino(s0.vino)||{}).fecce) return ''; const S0=stimaTaglio(s0.node); if(!S0) return '';
  const vals=S0.stima.vals; const keys=KEST.filter(k=>vals[k]!=null);
  if(S0.direct&&S0.stima.fonti.every(f=>f.tipo==='misurata'&&f.n.id===s0.node)) return '';
  { let en=s0.node; while(R.nodes[en]&&R.nodes[en].lav==='Certificazione DOP'&&R.nodes[en].parents.length===1) en=R.nodes[en].parents[0].n;
    if(en!==s0.node){ const S1=stimaTaglio(en); if(S1&&S1.direct&&S1.stima.fonti.every(f=>f.tipo==='misurata'&&f.n.id===en)) return ''; } }
  if(!keys.length) return `<div class="box small" style="background:var(--surface-2)">Nessuna analisi dei componenti di questo vino: non posso stimare i parametri del taglio.</div>`;
  const fonti=fontiUniche(S0.stima.fonti);
  return `<div class="box warn" style="color:var(--ink)"><div class="spread"><b>Analisi stimata del taglio</b><button class="btn sm pri" id="st-save">Salva come analisi stimata</button></div>
   <p class="small" style="margin:6px 0">Media ponderata sui volumi delle ultime analisi dei componenti${S0.direct?' (l’ultima analisi misurata è precedente all’ultimo taglio)':''}. pH e SO₂ non si sommano in modo lineare: per questi parametri è solo indicativa.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Parametro</th><th class="r">Stima</th><th class="r">Copertura</th></tr></thead><tbody>
   ${keys.map(k=>`<tr><td>${esc(k)}${['pH','Solforosa libera','Solforosa totale'].includes(k)?' <span class="muted small">(indicativo)</span>':''}</td><td class="r"><b>${nf(vals[k],k==='pH'?2:2)}</b></td><td class="r">${S0.stima.cov[k]<0.999?`<span class="chip warn">${nf(S0.stima.cov[k]*100,0)}% del vino</span>`:'100%'}</td></tr>`).join('')}</tbody></table></div>
   <p class="small muted" style="margin:6px 0 0">Analisi usate (ognuna una volta, con la quota di vino che rappresenta): ${fonti.map(fonteTxt).join(' · ')}</p></div>`;
}

function lavSnap(vs,dest){ const st=stOggi(), o={}; [...new Set([...(vs||[]),...(dest?[dest]:[])])].forEach(c=>{ if(st[c]) o[c]={vino:st[c].vino||null,L:st[c].L||0}; }); return {il:new Date().toISOString(),data:today(),vasche:o}; }
const lavVolBase = l=>l.volL||(l.vasche||[]).reduce((s,c)=>s+((l.rif&&l.rif.vasche[c]||{}).L||0),0);
/* confronto fra la situazione al momento della programmazione e quella registrata oggi */
function lavDiff(l){
  if(!l.rif||!lavAperto(l)) return null; const st=stOggi(), out=[];
  Object.entries(l.rif.vasche).forEach(([c,r])=>{ const n=st[c]; if(!n) return;
    if((r.vino||null)!==(n.vino||null)) out.push({c,tipo:'vino',da:r.vino,a:n.vino,txt:`${esc(vnome(c))}: alla programmazione conteneva ${r.vino?vName(r.vino):'niente (vuota)'}, ora ${n.vino?vName(n.vino):'è vuota'}`});
    else if(Math.abs((r.L||0)-(n.L||0))>Math.max(1,(r.L||0)*0.005)) out.push({c,tipo:'vol',da:r.L,a:n.L,txt:`${esc(vnome(c))}: ${hL(r.L)} alla programmazione, ora ${hL(n.L)}`}); });
  if(!out.length) return null;
  const rifTot=(l.vasche||[]).reduce((s,c)=>s+((l.rif.vasche[c]||{}).L||0),0), curTot=(l.vasche||[]).reduce((s,c)=>s+((st[c]||{}).L||0),0);
  return {righe:out, rifTot, curTot, fattore:rifTot>0?curTot/rifTot:null};
}
function lavDiffHTML(l){ const d=lavDiff(l); if(!d) return '';
  const pr=(l.prodotti||[]).filter(p=>p.dose!=null&&p.volL);
  return `<div class="box warn small" style="color:var(--ink)"><b>Da verificare: la cantina è cambiata dalla programmazione (${fd(l.rif.data)}).</b>
    <ul style="margin:6px 0;padding-left:18px">${d.righe.map(r=>`<li>${esc(r.txt)}</li>`).join('')}</ul>
    ${pr.length&&d.fattore!=null&&!l.volL?`<div>Quantità teoriche con i volumi attuali (le istruzioni originali <b>non</b> sono cambiate):</div><ul style="margin:6px 0;padding-left:18px">${pr.map(p=>`<li>${esc(p.prodotto)} ${nf(p.dose,3)} ${esc(p.udm)}: programmati <b>${qtaTeorica(p.dose,p.udm,p.volL)}</b> su ${hL(p.volL)} → oggi <b>${qtaTeorica(p.dose,p.udm,p.volL*d.fattore)||'—'}</b> su ${hL(p.volL*d.fattore)}</li>`).join('')}</ul>`:''}
    ${pr.length&&l.volL?`<div>Il volume da trattare era scritto a mano (${hL(l.volL)}): controlla se è ancora giusto.</div>`:''}</div>`; }
const lavVini = l=>[...new Set(Object.values((l.rif||{}).vasche||{}).map(r=>r.vino).filter(Boolean))];
function lavTitolo(l){ return l.titolo||[l.tipo,(l.vasche||[]).length?elencoV(l.vasche):'',l.dest?'→ '+l.dest:''].filter(Boolean).join(' · '); }
const lavLog = (l,stato,nota)=>{ (l.storia=l.storia||[]).push({il:new Date().toISOString(),stato,nota:nota||''}); l.stato=stato; l.modificatoIl=new Date().toISOString(); };
const lavNum = ()=>{ const n=lavori().reduce((m,l)=>Math.max(m,+(String(l.num||'').replace(/\D/g,''))||0),0)+1; return 'L'+String(n).padStart(4,'0'); };

function viewLavori(app){
  UI.lv=UI.lv||{vista:'elenco',giorno:today(),f:{}}; const V=UI.lv, F=V.f;
  const legacy=attivi(S.eventi).filter(e=>!e.storico&&e.data>today());
  const match=l=>(!F.vasca||(l.vasche||[]).includes(F.vasca)||l.dest===F.vasca)&&(!F.vino||lavVini(l).includes(F.vino))&&(!F.tipo||l.tipo===F.tipo)&&(!F.persona||l.assegnato===F.persona)&&(!F.stato||l.stato===F.stato);
  const chiusi=V.vista==='chiusi';
  const all=lavori().filter(l=>(chiusi?!lavAperto(l):lavAperto(l))&&match(l));
  const pOrd={alta:0,normale:1,bassa:2};
  const sortF=(a,b)=>(a.data||'9999')<(b.data||'9999')?-1:(a.data||'9999')>(b.data||'9999')?1:(a.ora||'99')<(b.ora||'99')?-1:(a.ora||'99')>(b.ora||'99')?1:pOrd[a.priorita||'normale']-pOrd[b.priorita||'normale'];
  const card=l=>{ const d=lavDiff(l), late=lavAperto(l)&&l.data&&l.data<today()&&l.stato!=='eseguito';
    return `<button class="lcard" data-lid="${l.id}"><div class="spread" style="width:100%;gap:6px"><span class="row" style="gap:6px">${l.priorita==='alta'?'<span class="chip scad">Alta</span>':l.priorita==='bassa'?'<span class="chip">Bassa</span>':''}<b>${esc(lavTitolo(l))}</b></span><span class="chip ${LSTCLS[l.stato]}">${LSTATI[l.stato]}</span></div>
      <div class="small muted">${esc(l.tipo)}${l.data?' · '+fd(l.data)+(l.ora?' '+esc(l.ora):''):' · senza data'}${l.assegnato?' · 👤 '+esc(l.assegnato):''}${lavVini(l).length?' · '+lavVini(l).map(v=>esc(vName(v))).join(', '):''}</div>
      ${d||late?`<div class="row" style="gap:6px">${d?'<span class="chip warn">Da verificare</span>':''}${late?'<span class="chip scad">Data superata</span>':''}</div>`:''}</button>`; };
  const group=(lab,list)=>`<div class="lgroup"><h3>${lab} <span class="muted small">${list.length}</span></h3>${list.length?list.map(card).join(''):'<p class="muted small">Nessun lavoro.</p>'}</div>`;
  let body='';
  if(V.vista==='elenco'||chiusi){ const nd=all.filter(l=>!l.data), byD={}; all.filter(l=>l.data).sort(sortF).forEach(l=>(byD[l.data]=byD[l.data]||[]).push(l));
    if(chiusi) body=all.length?[...all].sort((a,b)=>(b.modificatoIl||'')<(a.modificatoIl||'')?-1:1).map(card).join(''):'<p class="muted">Nessun lavoro completato o annullato.</p>';
    else body=(nd.length?group('Senza data',nd.sort(sortF)):'')+Object.keys(byD).map(d=>group(`${giornoNome(d)} ${fd(d)}${d===today()?' · oggi':d<today()?' · passato':''}`,byD[d])).join('')||'<p class="muted">Nessun lavoro programmato.</p>'; }
  else { const days=V.vista==='giorno'?[V.giorno]:settimana(V.giorno);
    body=`<div class="${V.vista==='settimana'?'lweek':''}">${days.map(d=>group(`${giornoNome(d)} ${fd(d)}${d===today()?' · oggi':''}`,all.filter(l=>l.data===d).sort(sortF))).join('')}</div>
      ${all.some(l=>!l.data)?`<p class="small muted">Ci sono anche ${all.filter(l=>!l.data).length} lavori senza data: li vedi in «Elenco».</p>`:''}`; }
  const vsUsed=[...new Set(lavori().flatMap(l=>[...(l.vasche||[]),...(l.dest?[l.dest]:[])]))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));
  const viUsed=[...new Set(lavori().flatMap(lavVini))], peUsed=[...new Set([...(S.persone||[]),...lavori().map(l=>l.assegnato).filter(Boolean)])];
  const sel=(k,lab,opts)=>`<label class="f">${lab}<select data-lf="${k}"><option value="">tutti</option>${opts.map(([v,t])=>`<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  app.innerHTML=`<div class="spread"><h2>Programmazione lavori</h2><button class="btn pri" id="lv-new">Nuovo lavoro</button></div>
  <p class="hint">Qui si programma e si controlla il lavoro. Un lavoro, anche se segnato come eseguito, <b>non cambia mai</b> giacenze, vasche, partite o storico: cambiano solo quando, in convalida, registri l'operazione vera.</p>
  ${legacy.length?`<div class="box warn small" style="color:var(--ink)"><b>${legacy.length} operazion${legacy.length===1?'e registrata':'i registrate'} con data futura</b> (vecchio sistema delle operazioni programmate). Ora le operazioni future si programmano qui. <button class="btn sm" id="lv-conv">Trasformale in lavori</button><ul style="margin:6px 0 0;padding-left:18px">${legacy.map(e=>`<li>${fd(e.data)} · ${esc(evTitle(e))}</li>`).join('')}</ul></div>`:''}
  <div class="panel"><div class="spread"><div class="seg" role="group" aria-label="Vista">${[['elenco','Elenco'],['giorno','Giorno'],['settimana','Settimana'],['chiusi','Completati e annullati']].map(([k,t])=>`<button data-lvv="${k}" aria-pressed="${V.vista===k}">${t}</button>`).join('')}</div>
    ${V.vista==='giorno'||V.vista==='settimana'?`<div class="row"><button class="btn sm" data-lvn="-1">←</button><input type="date" data-free id="lv-g" value="${V.giorno}" style="width:auto"><button class="btn sm" data-lvn="1">→</button><button class="btn sm ghost" data-lvn="0">Oggi</button></div>`:''}</div>
    <div class="fg" style="margin-top:10px">${sel('vasca','Vasca',vsUsed.map(c=>[c,vlab(c)+capTxt(c)]))}${sel('vino','Vino',viUsed.map(v=>[v,vName(v)]))}${sel('tipo','Tipologia',[...new Set([...lavTipiNomi(),...lavori().map(l=>l.tipo)])].map(t=>[t,t]))}${sel('stato','Stato',Object.entries(LSTATI).filter(([k])=>chiusi?!['dafare','incorso','eseguito'].includes(k):['dafare','incorso','eseguito'].includes(k)))}${sel('persona','Assegnato a',peUsed.map(p=>[p,p]))}</div></div>
  <div class="lbody">${body}</div>`;
  $('#lv-new',app).onclick=()=>formLavoro();
  $$('[data-lvv]',app).forEach(b=>b.onclick=()=>{V.vista=b.dataset.lvv; if(V.f.stato) V.f.stato=''; viewLavori(app);});
  $$('[data-lvn]',app).forEach(b=>b.onclick=()=>{const n=+b.dataset.lvn; V.giorno=n===0?today():addDays(V.giorno,n*(V.vista==='settimana'?7:1)); viewLavori(app);});
  const g=$('#lv-g',app); if(g) g.onchange=()=>{ if(g.value){V.giorno=g.value; viewLavori(app);} };
  $$('[data-lf]',app).forEach(s=>s.onchange=()=>{F[s.dataset.lf]=s.value; viewLavori(app);});
  $$('[data-lid]',app).forEach(b=>b.onclick=()=>lavDettaglio(b.dataset.lid));
  const cv=$('#lv-conv',app); if(cv) cv.onclick=()=>convertiProgrammate(legacy);
}
const giornoNome=d=>['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][new Date(d+'T12:00:00').getDay()];
const settimana=d=>{ const x=new Date(d+'T12:00:00'), wd=(x.getDay()+6)%7; const lun=addDays(d,-wd); return [0,1,2,3,4,5,6].map(i=>addDays(lun,i)); };

function convertiProgrammate(list){
  modal('Trasforma in lavori',`<p>Le ${list.length} operazioni con data futura diventano <b>lavori da fare</b> con la stessa data, e la registrazione futura viene annullata (resta nel registro come annullata). Giacenze e vasche tornano quelle reali di oggi.</p>
   <div class="foot"><button class="btn" data-close>Indietro</button><button class="btn pri" id="ok">Trasforma</button></div>`,(b,close)=>{
    $('#ok',b).onclick=()=>{ list.forEach(e=>{ const tr=e.tratte||[];
        const tipo=e.tipo==='imbottigliamento'?'Imbottigliamento':tr.length?(new Set(tr.map(t=>t.da)).size>1?'Assemblaggio':'Travaso'):(e.aggiunte||[]).length?'Aggiunta di prodotti enologici':'Operazione generica';
        const vs=e.vasca?[e.vasca]:tr.length?[...new Set(tr.map(t=>t.da))]:(e.vasche||[]);
        const l={id:uid(),num:lavNum(),titolo:evTitle(e),tipo,data:e.data,ora:'',priorita:'normale',assegnato:'',vasche:vs,dest:tr[0]&&tr[0].a||'',volL:e.L||(tr.length?tr.reduce((s,t)=>s+(t.L||0),0):null),
          prodotti:(e.aggiunte||[]).map(a=>({prodotto:a.prodotto,dose:a.dose,udm:a.udm,volL:a.volL||null})),istruzioni:'Creato dall\'operazione programmata del vecchio sistema: '+evTitle(e)+(e.note?'. '+e.note:''),stato:'dafare',creatoIl:new Date().toISOString(),modificatoIl:new Date().toISOString(),storia:[]};
        l.rif=lavSnap(l.vasche,l.dest); lavori().push(l);
        e.stato='annullato'; e.motivo='Trasformata in lavoro programmato '+l.num; e.annullatoIl=new Date().toISOString(); });
      close(); refresh(); toast('Operazioni trasformate in lavori'); };
  });
}

      const o={titolo:$('#w-tit',b).value.trim(),tipo,data:$('#w-data',b).value||'',ora:$('#w-ora',b).value||'',priorita:$('#w-prio',b).value,assegnato:ass,vasche:t.opt||vs.length?vs:[],dest,volL:volM||null,prodotti,istruzioni:$('#w-ist',b).value.trim(),rif,modificatoIl:now};
      if(ed){ const x=lavori().find(z=>z.id===ed.id); (x.storia=x.storia||[]).push({il:now,stato:x.stato,nota:'Istruzioni modificate'}); Object.assign(x,o); }

  });
}

   <div class="fg"><label class="f">Chi l'ha fatto<input id="x-da" list="x-pl" value="${esc(ex.da||l.assegnato||'')}"><datalist id="x-pl">${(S.persone||[]).map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>
   ${stato==='eseguito'&&(T.vol||T.dest)?`<label class="f">Volume movimentato (hL)<input id="x-vol" inputmode="decimal" value="${ex.volL?nfIn(ex.volL/100,3):''}" placeholder="facoltativo"></label>`:''}</div>
   ${stato==='eseguito'&&(l.prodotti||[]).length?`<fieldset class="lvf"><legend>Quantità usate davvero</legend><div class="fg">${l.prodotti.map((p,i)=>`<label class="f">${esc(p.prodotto)} <span class="muted small">(teorica ${qtaTeorica(p.dose,p.udm,p.volL)||'—'})</span><input data-xp="${i}" value="${esc((ex.prodotti||[])[i]||'')}" placeholder="es. 200 g"></label>`).join('')}</div></fieldset>`:''}
   <label class="f wide">${stato==='eseguito'?'Note':'Motivo'}<textarea id="x-no">${esc(ex.note||'')}</textarea></label>
   ${stato==='eseguito'?`<label class="f wide">Differenze rispetto alle istruzioni<textarea id="x-df" placeholder="lascia vuoto se fatto come previsto">${esc(ex.diff||'')}</textarea></label>`:''}
   <div id="msg" class="err"></div>

      lavLog(l,stato,stato==='eseguito'?(l.esec.diff?'Eseguito con differenze':'Eseguito'):'Non eseguito: '+no); close(); refresh(); lavDettaglio(l.id); };

function formConvalida(l){
  const T=LT(l.tipo)||{}; const d=lavDiff(l);
  modal('Convalida · '+lavTitolo(l),`
   ${l.stato!=='eseguito'?'<div class="box warn small">Nessuno ha ancora dichiarato il lavoro come eseguito: convalidi direttamente tu.</div>':''}
   ${lavDiffHTML(l)}
   <p>La convalida chiude il lavoro. ${T.reg?'Per aggiornare giacenze e storico apri il modulo dell\'operazione vera, già compilato con i dati del lavoro: controllalo e salvalo. Il lavoro risulta convalidato solo dopo il salvataggio.':'Questa tipologia di solito non produce movimenti di vino.'}</p>
   <div class="foot"><button class="btn" data-close>Indietro</button><button class="btn" id="cv-no">Convalida senza registrare</button>${T.reg?`<button class="btn pri" id="cv-reg">Registra ${T.reg==='an'?'l\'analisi':'l\'operazione'}…</button>`:''}</div>`,(b,close)=>{
    $('#cv-no',b).onclick=()=>{ l.convalida={il:new Date().toISOString(),ev:null}; lavLog(l,'convalidato','Convalidato senza registrare operazioni'); close(); refresh(); toast('Lavoro convalidato'); };
    const r=$('#cv-reg',b); if(r) r.onclick=()=>{ close(); apriRegistrazione(l); };
  });

function apriRegistrazione(l){
  const T=LT(l.tipo)||{}, ex=l.esec||{}, st=stOggi(); const vol=ex.volL||l.volL||null;
  const agg=(l.prodotti||[]).map((p,i)=>({prodotto:p.prodotto,dose:p.dose,udm:p.udm,vasca:'',volL:null,volManual:false,reale:(ex.prodotti||[])[i]||''}));
  const note=[`Da lavoro ${l.num||''}: ${lavTitolo(l)}`,ex.diff?'Differenze: '+ex.diff:'',ex.note||''].filter(Boolean).join('. ');
  UI.pendLav={id:l.id,nEv:S.eventi.length,nAn:S.analisi.length};
  if(T.reg==='trav'){ const src=(l.vasche||[]).filter(c=>st[c]&&st[c].vino); const tratte=(src.length?src:l.vasche).map((c,i)=>({da:c,a:l.dest,L:(src.length<=1?vol:null)}));
    formLavorazione({lav:l.tipo==='Colmatura'?'Travaso + Colmatura':'Travaso',tratte,aggiunte:agg,note,data:today()}); }
  else if(T.reg==='lav'&&T.voce){ const fase=lavList('Vinificazione').includes(l.tipo)&&!lavList('Affinamento').includes(l.tipo)?'Vinificazione':'Affinamento'; formLavorazione({lavori:[l.tipo],fase,vasche:l.vasche,aggiunte:agg,note,data:today()}); }
  else if(T.reg==='lav'){ const lavN={'Chiarifica':'Chiarifica','Filtrazione':'','Rimontaggio / vinificazione':''}[l.tipo]; formLavorazione({lav:lavN||'',vasche:l.vasche,aggiunte:agg,note,data:today()}); }
  else if(T.reg==='man') formManutenzione(l.vasche,{man:l.tipo==='Mantenimento botti'?MAN_TIPI[0]:'Pulizia',prodotti:(l.prodotti||[]).map((p,i)=>({...p,reale:(ex.prodotti||[])[i]||''})),volL:l.volL,note});
  else if(T.reg==='imb') formImbottigliamento({vasca:l.vasche[0],L:vol,data:today(),note});
  else if(T.reg==='an'){ const v=(st[l.vasche[0]]||{}).vino; if(!v){ UI.pendLav=null; toast('La vasca non contiene vino: impossibile registrare l\'analisi'); return; } formAnalisi(v,null,{ambito:'vasca',vasche:l.vasche.filter(c=>(st[c]||{}).vino===v),data:today()}); }
}
/* chiamata da refresh(): se la registrazione aperta dal lavoro è stata salvata, il lavoro diventa convalidato */
function lavCheckPend(){ const p=UI.pendLav; if(!p) return; const l=lavori().find(x=>x.id===p.id); if(!l){UI.pendLav=null;return;}
  if(S.eventi.length>p.nEv){ const ev=S.eventi[S.eventi.length-1]; l.convalida={il:new Date().toISOString(),ev:ev.id,titolo:evTitle(ev)}; lavLog(l,'convalidato','Convalidato con registrazione: '+evTitle(ev)); UI.pendLav=null; }
  else if(S.analisi.length>p.nAn){ const a=S.analisi[S.analisi.length-1]; l.convalida={il:new Date().toISOString(),ev:'an:'+a.id,titolo:'Analisi del '+fd(a.data)}; lavLog(l,'convalidato','Convalidato con analisi registrata'); UI.pendLav=null; } }

/* ===================== Manutenzione contenitori ===================== */
const MAN_TIPI=['Mantenimento (acqua + acido citrico + SO₂)','Pulizia','Solforazione','Altro'];
const MAN_PROD={'Mantenimento (acqua + acido citrico + SO₂)':[{prodotto:'Acido citrico',udm:'g/L'},{prodotto:'SO₂',udm:'g/hL'}],'Solforazione':[{prodotto:'SO₂',udm:'g/hL'}]};
function formManutenzione(codes,p={},corrId){
  let vs=[...(codes||[])]; const st=R.st;
  const vOpt=()=>`<option value="">—</option>`+VASCHE.filter(v=>v.stato==='attivo'&&!vs.includes(v.code)).map(v=>`<option value="${esc(v.code)}">${vascaLab(v.code,st[v.code])}</option>`).join('');
  const tipo0=p.man&&MAN_TIPI.includes(p.man)?p.man:(p.man?'Altro':(vs.some(c=>VMAP[c]&&VMAP[c].kind==='botte')?MAN_TIPI[0]:'Pulizia'));
  modal(corrId?'Correggi manutenzione':'Manutenzione contenitori',`<form id="fmn" novalidate>
   <p class="hint">Per i contenitori, di solito vuoti: non cambia vini né giacenze. Finisce nel registro e nella storia del contenitore. Quando ci entra del vino la manutenzione si chiude da sola.</p>
   <div class="fg">
    <label class="f">Data<input type="date" id="m-data" value="${esc(p.data||today())}"></label>
    <label class="f">Tipo<select id="m-tipo">${MAN_TIPI.map(t=>`<option ${t===tipo0?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <label class="f" id="m-altw" ${tipo0==='Altro'?'':'hidden'}>Quale<input id="m-alt" value="${esc(tipo0==='Altro'?p.man||'':'')}" placeholder="es. sanificazione a vapore"></label>
    <label class="f">Durata (giorni)<input id="m-gg" inputmode="numeric" value="${p.giorni||''}" placeholder="facoltativa"></label>
   </div>
   <fieldset class="lvf"><legend>Contenitori</legend><div class="row" id="m-vs"></div>
    <div class="fg"><label class="f">Aggiungi contenitore<select id="m-add">${vOpt()}</select></label>
    <label class="f">Volume della soluzione (hL)<input id="m-vol" inputmode="decimal" value="${p.volL?nfIn(p.volL/100,3):''}" placeholder="auto"></label></div>
    <div class="hint" id="m-info"></div></fieldset>
   <fieldset class="lvf"><legend>Prodotti</legend><div id="m-prs"></div><button type="button" class="btn sm" id="m-padd">+ Aggiungi prodotto</button>
    <p class="hint" style="margin:6px 0 0">Quantità teorica = dose × volume della soluzione (se vuoto: la capacità dei contenitori).</p></fieldset>
   <label class="f wide">Note<textarea id="m-no">${esc(p.note||'')}</textarea></label>
   <div id="msg" class="err"></div>
   <div class="foot"><button type="button" class="btn" data-close>Annulla</button><button class="btn pri" id="sv">${corrId?'Salva correzione':'Salva'}</button></div></form>`,(b,close)=>{
    const capTot=()=>vs.reduce((a,c)=>a+(VMAP[c]?VMAP[c].cap*100:0),0);
    const volU=()=>toL($('#m-vol',b).value,'hL')||capTot();
    const line=(x={})=>{ const d=document.createElement('div'); d.className='line lprod';
      d.innerHTML=`<label class="f">Prodotto<input class="p-n" list="m-prl" value="${esc(x.prodotto||'')}"></label>
       <label class="f">Dose<input class="p-d" inputmode="decimal" value="${x.dose!=null?nfIn(x.dose,3):''}"></label>
       <label class="f">Unità<select class="p-u">${UDM.map(u=>`<option ${(x.udm||'g/hL')===u?'selected':''}>${u}</option>`).join('')}</select></label>
       <div class="f"><span>Quantità teorica</span><b class="p-q">—</b></div>
       <label class="f">Usata davvero<input class="p-r" value="${esc(x.reale||'')}" placeholder="facoltativa"></label>
       <button type="button" class="btn sm ghost p-x">Togli</button>`;
      $('.p-x',d).onclick=()=>{d.remove();upd();}; d.oninput=upd; d.onchange=upd; $('#m-prs',b).append(d); };
    const renderVs=()=>{ $('#m-vs',b).innerHTML=vs.length?vs.map(c=>`<span class="chip">${esc(vlab(c))} · ${nf(VMAP[c].cap)} hL${st[c]&&st[c].vino?' · <b>contiene '+esc(vName(st[c].vino))+'</b>':''} <button type="button" data-rm="${esc(c)}" style="border:0;background:none;cursor:pointer" aria-label="Togli">×</button></span>`).join(''):'<span class="muted small">nessun contenitore</span>';
      $$('[data-rm]',b).forEach(x=>x.onclick=()=>{ vs=vs.filter(c=>c!==x.dataset.rm); $('#m-add',b).innerHTML=vOpt(); renderVs(); upd(); }); };
    const upd=()=>{ $('#m-altw',b).hidden=$('#m-tipo',b).value!=='Altro'; const ct=capTot(); $('#m-vol',b).placeholder=ct?'auto '+nf(ct/100,2):'auto';
      $('#m-info',b).textContent=vs.some(c=>st[c]&&st[c].vino)?'Attenzione: alcuni contenitori contengono vino.':'';
      const v=volU(); $$('.lprod',b).forEach(d=>{ const q=qtaTeorica(num($('.p-d',d).value),$('.p-u',d).value,v,$('.p-n',d).value); $('.p-q',d).textContent=q?q+' su '+hL(v):'—'; }); };
    b.insertAdjacentHTML('beforeend',`<datalist id="m-prl">${prodVisibili().map(x=>`<option value="${esc(x.nome)}">${esc(x.categoria||'')}</option>`).join('')}</datalist>`);
    (p.prodotti&&p.prodotti.length?p.prodotti:(MAN_PROD[tipo0]||[])).forEach(line);
    $('#m-tipo',b).onchange=()=>{ if(!$$('.lprod',b).some(d=>$('.p-d',d).value)){ $('#m-prs',b).innerHTML=''; (MAN_PROD[$('#m-tipo',b).value]||[]).forEach(line); } upd(); };
    $('#m-add',b).onchange=e=>{ const c=e.target.value; if(c&&!vs.includes(c)) vs.push(c); e.target.innerHTML=vOpt(); renderVs(); upd(); };
    $('#m-padd',b).onclick=()=>{line();upd();}; $('#m-vol',b).oninput=upd;
    renderVs(); upd();
    $('#fmn',b).onsubmit=e=>{ e.preventDefault(); const m=$('#msg',b);
      if(!vs.length){ m.textContent='Scegli almeno un contenitore.'; return; }
      const tipo=$('#m-tipo',b).value, man=tipo==='Altro'?($('#m-alt',b).value.trim()||'Manutenzione'):tipo;
      const vol=volU(); const prodotti=$$('.lprod',b).map(d=>({prodotto:$('.p-n',d).value.trim(),dose:num($('.p-d',d).value),udm:$('.p-u',d).value,volL:vol,reale:$('.p-r',d).value.trim()})).filter(x=>x.prodotto);

const SCALE={babo:'°Babo',brix:'°Brix',dens:'Densità'};
const misTxt = m=>[m.val!=null&&m.val!==''?gradoTxt(m.val,m.scala):'',m.T!=null?nf(m.T,1)+' °C':'',m.ph!=null?'pH '+nf(m.ph,2):''].filter(Boolean).join(' · ')||'—';
const scalaDef = ()=>(S&&S.scalaFerm)||'babo';
const gradoTxt = (v,sc)=>v==null||v===''?'—':sc==='dens'?'densità '+nf(v,v>10?0:3):nf(v,1)+' '+(SCALE[sc]||'');
const scalaSel = (id,sc)=>`<select id="${id}">${Object.entries(SCALE).map(([k,t])=>`<option value="${k}" ${k===(sc||scalaDef())?'selected':''}>${t}</option>`).join('')}</select>`;
const evById = id=>S.eventi.find(e=>e.id===id);
const UVA_CATS=[['Rosso','uva da vino rosso'],['Bianco','uva da vino bianco'],['Rosato','uva da vino rosato'],['Atto a DOP','atta a DOP']];
const uvaClass = e=>!e||!e.categoria?'':(e.categoria==='Atto a DOP'?'atta a '+(e.denominazione||'DOP'):'uva da vino '+e.categoria.toLowerCase())+(annNorm(e.annata)==='S.A.'?' s.a.':e.annata?' '+e.annata:'');
const uvaLab = e=>e?([e.fonte,e.varieta,uvaClass(e)].filter(Boolean).length?[e.fonte,e.varieta,uvaClass(e)]:['Uva']).concat([nf(e.kg,0)+' kg']).filter(Boolean).join(' · '):'uva';
const uvaKey = e=>[e.categoria||'',e.categoria==='Atto a DOP'?e.denominazione||'':'',annNorm(e.annata)].join('|');
const uvaRes = id=>{ const u=(R.uve||{})[id], e=evById(id); return e?(e.kg||0)-(u?u.usato:0):0; };
function uveDescr(ev){ const p=(ev.uve||[]).map(u=>{ const e=evById(u.uva)||{}; return `${e.fonte||'uva'} ${nf(u.kg,0)} kg${e.varieta?' '+e.varieta:''}`; });
  return 'Uve: '+(p.join(', ')||'—')+(ev.conto?' · conto lavorazione '+ev.conto:''); }
const inVin = s=>!!(s&&(s.ferm||s.vinif));
const vinDal = s=>(s.vinif||s.ferm||{}).inizio;
const fermLog = ()=>(S.fermLog=S.fermLog||[]);
const fermDi = (code,dal)=>fermLog().filter(m=>m.vasca===code&&(!dal||m.data>=dal)).sort((a,b)=>(a.data+(a.ora||''))<(b.data+(b.ora||''))?-1:1);
const giorniDa = d=>Math.max(0,Math.round((new Date(asOf()+'T12:00:00')-new Date(d+'T12:00:00'))/864e5));

function fermCurve(code,W=520,H=170){
  const s=R.st[code]; const ms=fermDi(code,inVin(s)?vinDal(s):null).filter(m=>m.data<=asOf()); if(!ms.length) return '<p class="muted small">Nessuna misura di fermentazione'+(asOf()<today()?' fino al '+fd(asOf()):'')+': usa «Densità / temp.».</p>';
  const msv=ms.filter(m=>!m.op&&m.val!=null); const sc=msv.length?msv[msv.length-1].scala:scalaDef(), pts=msv.filter(m=>m.scala===sc), tp=ms.filter(m=>!m.op&&m.T!=null), opm=ms.filter(m=>m.op&&!m.saltato);
  const t=m=>new Date(m.data+'T'+(m.ora||'12:00')).getTime(); const all=ms.map(t); const x0=Math.min(...all), x1=Math.max(...all)+1;
  const L=46,Rr=44,T0=14,B=26, X=v=>L+(W-L-Rr)*(x1===x0?0.5:(v-x0)/(x1-x0));
  const rng=a=>{ if(!a.length) return [0,1]; let lo=Math.min(...a), hi=Math.max(...a); if(hi-lo<1e-9){lo-=1;hi+=1;} const pad=(hi-lo)*0.1; return [lo-pad,hi+pad]; };
  const [v0,v1]=rng(pts.map(m=>m.val)), [c0,c1]=rng(tp.map(m=>m.T));
  const Y=v=>T0+(H-T0-B)*(1-(v-v0)/(v1-v0)), YT=v=>T0+(H-T0-B)*(1-(v-c0)/(c1-c0));
  const line=(a,f,col,dash)=>a.length?`<polyline fill="none" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="4 3"':''} points="${a.map(m=>X(t(m)).toFixed(1)+','+f(m).toFixed(1)).join(' ')}"/>`+a.map(m=>`<circle cx="${X(t(m)).toFixed(1)}" cy="${f(m).toFixed(1)}" r="3" fill="${col}"><title>${fd(m.data)}${m.ora?' '+m.ora:''} · ${esc(misTxt(m))}</title></circle>`).join(''):'';
  const fmt=v=>sc==='dens'?nf(v,v>10?0:3):nf(v,1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Curva di fermentazione">
    <line x1="${L}" y1="${H-B}" x2="${W-Rr}" y2="${H-B}" stroke="var(--line)"/>
    <text x="${L-4}" y="${T0+8}" text-anchor="end" font-size="12" fill="var(--c1,#8a2b3c)">${fmt(v1)}</text><text x="${L-4}" y="${H-B}" text-anchor="end" font-size="12" fill="var(--c1,#8a2b3c)">${fmt(v0)}</text>
    ${tp.length?`<text x="${W-Rr+4}" y="${T0+8}" font-size="12" fill="#2f7fb5">${nf(c1,0)}°C</text><text x="${W-Rr+4}" y="${H-B}" font-size="12" fill="#2f7fb5">${nf(c0,0)}°C</text>`:''}
    <text x="${L}" y="${H-6}" font-size="12" fill="var(--muted)">${fd(ms[0].data).slice(0,5)}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" font-size="12" fill="var(--muted)">${fd(ms[ms.length-1].data).slice(0,5)}</text>
    ${opm.map(m=>`<path d="M${X(t(m)).toFixed(1)} ${H-B-1}l-4 -7h8z" fill="#8b8b8b"><title>${fd(m.data)} ${m.ora||''} · ${esc(m.op)}${m.min?' '+m.min+' min':''}</title></path>`).join('')}
    ${line(tp,m=>YT(m.T),'#2f7fb5',true)}${line(pts,m=>Y(m.val),'var(--accent,#8a2b3c)')}
  </svg><div class="small muted">${pts.length?`<span style="color:var(--accent,#8a2b3c)">━</span> ${esc(SCALE[sc])}`:''}${tp.length?' · <span style="color:#2f7fb5">┅</span> temperatura':''}${opm.length?' · <span style="color:#8b8b8b">▼</span> operazioni ('+esc(opsTxt(opm))+')':''}</div>`;
}

const rigaTxt = r=>`${r.op} ${(r.volte||1)>1?r.volte+' volte':'1 volta'}${(r.ogni||1)>1?' ogni '+r.ogni+' giorni':' al giorno'}${r.min?' · '+r.min+' min':''}${r.modo?' · '+r.modo:''} · ${r.al?'giorni '+(r.dal||1)+'–'+r.al:'dal giorno '+(r.dal||1)}`;

      <div style="margin-top:4px">${rs.map(r=>`<span class="chip" style="text-transform:none;letter-spacing:0;margin:2px">${esc(r.prot?rigaTxt(r):rigaTxtData(r,c))}${r.prot?'':' <span class="muted">(extra)</span>'} <button type="button" data-rdel="${r.id}" style="border:0;background:none;cursor:pointer" aria-label="Togli">×</button></span>`).join('')||'<span class="muted">nessuna routine</span>'}</div></div>`; }).join('')}
   <div class="row" style="gap:6px;margin-top:8px;align-items:flex-end;flex-wrap:wrap"><label class="f" style="max-width:260px">Protocollo${protSel('vin-pr',(()=>{ const ps=[...new Set(ts.map(c=>(protVasca(c)||{}).prot||''))]; return ps.length===1?ps[0]:''; })())}</label><button type="button" class="btn sm" id="vin-pra">Applica alle vasche spuntate</button></div>
   <div class="row" style="gap:6px;margin-top:8px;align-items:flex-end;flex-wrap:wrap"><label class="f" style="max-width:190px">Operazione extra<select id="vin-rop">${ROUT_OPS().map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>
     <label class="f" style="max-width:70px">Volte<input id="vin-rn" inputmode="numeric" value="1"></label><label class="f" style="max-width:90px">Ogni (gg)<input id="vin-ro" inputmode="numeric" value="1"></label>
     <label class="f" style="max-width:170px">Dal<input type="date" id="vin-rd" data-free value="${today()}"></label><label class="f" style="max-width:170px" title="Vuoto = fino alla fine della vinificazione">Fino al (facoltativo)<input type="date" id="vin-ra" data-free></label>
     <button type="button" class="btn sm" id="vin-radd">Aggiungi</button></div>
   <p class="hint" style="margin:4px 0 0">I protocolli si preparano in Dati → «Protocolli di vinificazione». Tutto compare in Vendemmia → «Da fare oggi» finché la vasca è in vinificazione.</p>`; }
function protEditorBind(box,ts,after){
  $$('[data-rdel]',box).forEach(x=>x.onclick=()=>{ S.routine=routine().filter(r=>r.id!==x.dataset.rdel); save(); route(); after(); });
  const pa=$('#vin-pra',box); if(pa) pa.onclick=()=>{ const id=$('#vin-pr',box).value; if(!ts.length) return toast('Spunta almeno una vasca'); ts.forEach(c=>applicaProt([c],id,vinDal(R.st[c])||today())); save(); route(); toast(id?'Protocollo applicato':'Protocollo tolto'); after(); };
  const ra=$('#vin-radd',box); if(ra) ra.onclick=()=>{ if(!ts.length) return toast('Spunta almeno una vasca'); const n=v=>Math.max(1,Math.round(num(v)||1));
    if($('#vin-ra',box).value&&$('#vin-ra',box).value<($('#vin-rd',box).value||today())) return toast('La data di fine è prima di quella di inizio');
    ts.forEach(c=>routine().push({id:uid(),vasca:c,creato:today(),op:$('#vin-rop',box).value,volte:n($('#vin-rn',box).value),ogni:n($('#vin-ro',box).value),dal:Math.max(1,giornoVin(c,$('#vin-rd',box).value||today())),al:$('#vin-ra',box).value?Math.max(1,giornoVin(c,$('#vin-ra',box).value)):null}));
    save(); route(); toast('Routine aggiunta'); after(); };
}

function viewVendemmia(app){
  const ev=attivi(S.eventi); const Yn=today().slice(0,4);
  const anni=[...new Set([Yn,...ev.filter(e=>e.tipo==='uva'||e.tipo==='pigiatura').map(e=>e.data.slice(0,4))])].sort().reverse();
  const Y=UI.vendY&&anni.includes(UI.vendY)?UI.vendY:anni[0];
  const uve=ev.filter(e=>e.tipo==='uva'&&e.data.startsWith(Y)).sort((a,b)=>before(a,b)?-1:1);
  const pig=ev.filter(e=>e.tipo==='pigiatura'&&e.data.startsWith(Y)).sort((a,b)=>before(a,b)?-1:1);
  const kgTot=uve.reduce((a,e)=>a+(e.kg||0),0), attesa=uve.filter(e=>uvaRes(e.id)>0.5), kgAtt=attesa.reduce((a,e)=>a+uvaRes(e.id),0);
  const kgPig=pig.reduce((a,e)=>a+(e.uve||[]).reduce((s,u)=>s+(u.kg||0),0),0), Lpig=pig.reduce((a,e)=>a+(e.dest||[]).reduce((s,d)=>s+(d.L||0),0),0);

  const ops=e=>`<button class="btn sm ghost" data-corr="${e.id}">Correggi</button><button class="btn sm ghost danger" data-ann="${e.id}">Annulla</button>`;

    <div class="row"><button class="btn" id="vd-op">Lavorazione</button><button class="btn pri" id="vd-uva">Entrata uva</button><button class="btn" id="vd-pig">Pigiadiraspatura / pressatura</button></div></div>
  <div class="panel"><div class="row" style="gap:28px;flex-wrap:wrap">
    <div><div class="muted small">Uva entrata</div><b style="font-size:1.4rem">${nf(kgTot,0)} kg</b></div>
    <div><div class="muted small">Uva lavorata</div><b style="font-size:1.4rem">${nf(kgPig,0)} kg</b></div>
    <div><div class="muted small">In attesa</div><b style="font-size:1.4rem">${nf(kgAtt,0)} kg</b></div>
    <div><div class="muted small">Mosto ottenuto</div><b style="font-size:1.4rem">${hL(Lpig)}</b></div>
    ${(()=>{ const mi=ev.filter(e=>e.tipo==='carico'&&e.prodotto&&e.data.startsWith(Y)).reduce((a,e)=>a+(e.L||0),0); return mi?`<div><div class="muted small">Mosto entrato da fuori</div><b style="font-size:1.4rem">${hL(mi)}</b></div>`:''; })()}
    <div><div class="muted small">Resa media</div><b style="font-size:1.4rem">${resa(Lpig,kgPig)}</b> <span class="muted small">litri ogni 100 kg</span></div></div>
    ${uve.length?`<div class="small" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"><div><span class="muted">Per varietà:</span> ${grp(e=>e.varieta)}</div><div><span class="muted">Per classificazione:</span> ${grp(e=>uvaClass(e))}</div><div><span class="muted">Per provenienza:</span> ${grp(e=>e.fonte)}</div><div><span class="muted">Conto lavorazione:</span> ${grp(e=>e.conto||NOSTRO+' (vino nostro)')}</div></div>`:''}</div>
  ${(()=>{ const df=daFareOggi(); if(!df.length) return ''; const oggi=df.filter(r=>!r.arretrato), arr=df.filter(r=>r.arretrato); const tot=oggi.reduce((a,r)=>a+r.manca,0);
    const vs=[...new Set(df.map(r=>r.vasca))];
    return `<div class="panel"><div class="spread"><h3>Da fare oggi</h3><span class="muted small">${tot?tot+' da fare':'tutto fatto'}${arr.length?` · <span style="color:var(--danger)">${arr.reduce((a,r)=>a+r.manca,0)} arretrati da ieri</span>`:''}</span></div><div class="tbl-wrap"><table><tbody>
     ${vs.map(c=>{ const rs=df.filter(r=>r.vasca===c); const pv=protVasca(c); const daFare=rs.filter(r=>!r.arretrato&&r.manca&&r.op!=='Misura');
       return `<tr><td colspan="3" style="background:var(--bg-soft,transparent)"><b>${esc(vlab(c))}</b> <span class="muted small">${esc(vName(R.st[c].vino))} · giorno ${giornoVin(c,today())}${pv?' · '+esc(pv.nome):''}</span></td><td class="r">${daFare.length?`<button class="btn sm" data-tutto="${esc(c)}">Fatto tutto</button>`:''}</td></tr>`+
       rs.map(r=>`<tr style="${!r.manca?'opacity:.55':''}${r.arretrato?';color:var(--danger)':''}"><td style="padding-left:22px">${esc(r.op)}${r.min?' <span class="muted small">'+r.min+' min'+(r.modo?' '+esc(r.modo):'')+'</span>':''}${r.arretrato?' <span class="chip" style="color:var(--danger);border-color:var(--danger)">ieri, non fatto</span>':''}</td>
         <td>${'●'.repeat(Math.min(r.fatti,r.volte))}${'○'.repeat(r.manca)} <span class="muted small">${r.fatti} di ${r.volte}</span></td><td></td>
         <td class="r" style="white-space:nowrap">${r.manca?(r.op==='Misura'&&!r.arretrato?`<button class="btn sm pri" data-dmis="${esc(c)}">Inserisci misura</button>`:`<button class="btn sm pri" data-fatto="${esc(c)}|${esc(r.op)}|${r.arretrato?addDays(today(),-1):''}">✓ Fatto</button>`)+` <button class="btn sm ghost" data-salta="${esc(c)}|${esc(r.op)}|${r.arretrato?addDays(today(),-1):''}">Saltato</button>`:'<span class="chip ok">fatto</span>'}</td></tr>`).join(''); }).join('')}</tbody></table></div></div>`; })()}
  <div class="panel"><h3>Vasche in vinificazione</h3>
   ${fer.length?`<div class="tbl-wrap"><table><thead><tr><th>Vasca</th><th>Vino</th><th>Dal</th><th class="r">Volume</th><th>Ultima misura</th><th>Oggi</th><th></th></tr></thead><tbody>
    ${fer.map(v=>{ const s=R.st[v.code], ms=fermMis(v.code,vinDal(s)), l=ms[ms.length-1];
      return `<tr><td><b>${esc(vlab(v.code))}</b></td><td>${s.vino?`${tipoDot(s.vino)} <a href="#vino-${s.vino}">${esc(vName(s.vino))}</a>`:'—'}</td><td>${fd(vinDal(s))} <span class="muted small">(${giorniDa(vinDal(s))} gg)</span>${s.ferm?'':'<div><span class="chip" style="text-transform:none;letter-spacing:0">fermentazione non iniziata</span></div>'}</td><td class="r">${hL(s.L)}</td>
       <td>${l?`${esc(misTxt(l))} <span class="muted small">${fd(l.data).slice(0,5)}${l.ora?' '+l.ora:''}</span>`:'<span class="muted">nessuna</span>'}</td>
       <td class="small">${esc(opsTxt(fermOps(v.code,today())))||'<span class="muted">—</span>'}</td>
       <td class="r" style="white-space:nowrap"><button class="btn sm pri" data-orap="${esc(v.code)}">Lavorazione</button> <button class="btn sm" data-fm="${esc(v.code)}">+ Misura</button> <button class="btn sm" data-fc="${esc(v.code)}">Curva</button> <button class="btn sm lavoff" data-ff="${esc(v.code)}">Fine</button></td></tr>
       <tr data-fcr="${esc(v.code)}" hidden><td colspan="7"><div style="max-width:600px">${fermCurve(v.code)}</div></td></tr>`; }).join('')}</tbody></table></div>`:'<p class="muted small">Nessuna vasca in fermentazione. Le vasche entrano in fermentazione dalla pigiatura (casella «iniziano la fermentazione») o dal pulsante «Densità / temp.» della vasca.</p>'}</div>
  <div class="panel"><h3>Uve in attesa di lavorazione</h3>
   ${attesa.length?`<div class="tbl-wrap"><table><thead><tr><th>Arrivo</th><th>Provenienza</th><th>Varietà</th><th>Classificazione</th><th>Conto lavorazione</th><th class="r">Da lavorare</th><th>Grado</th><th></th></tr></thead><tbody>
    ${attesa.map(e=>`<tr><td>${fd(e.data)}</td><td>${esc(e.fonte||'—')}</td><td>${esc(e.varieta||'—')}</td><td class="small">${esc(uvaClass(e)||'—')}</td><td>${esc(e.conto||'vino nostro')}</td><td class="r"><b>${nf(uvaRes(e.id),0)} kg</b>${uvaRes(e.id)<e.kg-0.5?` <span class="muted small">di ${nf(e.kg,0)}</span>`:''}</td><td>${esc(gradoTxt(e.grado,e.scala))}</td><td class="r"><button class="btn sm pri" data-lavu="${e.id}">Lavora</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Nessuna uva in attesa.</p>'}</div>
  <div class="panel"><h3>Pigiature e pressature ${Y}</h3>
   ${pig.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Lavorazione</th><th>Uve</th><th>Vino</th><th>Vasche</th><th class="r">Mosto</th><th class="r">Resa</th><th></th></tr></thead><tbody>
    ${pig.map(e=>{ const kg=(e.uve||[]).reduce((s,u)=>s+(u.kg||0),0), L=(e.dest||[]).reduce((s,d)=>s+(d.L||0),0);
      return `<tr><td>${fd(e.data)}</td><td>${esc(e.lav||'')}</td><td class="small">${(e.uve||[]).map(u=>esc(uvaLab({...(evById(u.uva)||{}),kg:u.kg}))).join('<br>')}</td><td>${tipoDot(e.vino)} <a href="#vino-${e.vino}">${esc(vName(e.vino))}</a></td>
       <td class="small">${(e.dest||[]).map(d=>`<div style="white-space:nowrap">${vkind(d.vasca)} <b>${esc(vlab(d.vasca))}</b> · ${hL(d.L)}${d.fraz?` <span class="chip" style="text-transform:none;letter-spacing:0">${esc(d.fraz)}</span>`:''}</div>`).join('')}</td><td class="r" style="white-space:nowrap">${hL(L)}</td><td class="r" style="white-space:nowrap">${resa(L,kg)}${kg&&(L/kg>1||L/kg<0.3)?' <span class="chip warn" title="Controlla kg e litri (unità hL/L)">anomala</span>':''}</td><td class="r" style="white-space:nowrap">${ops(e)}</td></tr>`; }).join('')}</tbody></table></div>`:'<p class="muted small">Nessuna lavorazione di uve.</p>'}</div>
  <div class="panel"><h3>Uve arrivate ${Y}</h3>
   ${uve.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Provenienza</th><th>Varietà</th><th>Classificazione</th><th>Conto lavorazione</th><th class="r">Kg</th><th>Grado</th><th>Note</th><th></th></tr></thead><tbody>
    ${uve.map(e=>`<tr><td>${fd(e.data)}</td><td>${esc(e.fonte||'—')}</td><td>${esc(e.varieta||'—')}</td><td class="small">${esc(uvaClass(e)||'—')}</td><td>${esc(e.conto||'vino nostro')}</td><td class="r">${nf(e.kg,0)}</td><td>${esc(gradoTxt(e.grado,e.scala))}</td><td class="small muted">${esc(e.note||'')}</td><td class="r" style="white-space:nowrap">${ops(e)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Nessuna uva registrata nel '+Y+'.</p>'}</div>`;
  $$('[data-vy]',app).forEach(b=>b.onclick=()=>{ UI.vendY=b.dataset.vy; viewVendemmia(app); });
  $('#vd-uva',app).onclick=()=>formUva();
  $('#vd-op',app).onclick=()=>formLavorazione({vasche:fer.map(v=>v.code),fase:'Vinificazione'});
  $$('[data-orap]',app).forEach(b=>b.onclick=()=>formLavorazione({vasche:[b.dataset.orap],fase:'Vinificazione'}));
  const rigaDi=(c,op)=>dovuti(c,today()).find(x=>x.op===op)||{};
  $$('[data-fatto]',app).forEach(b=>b.onclick=()=>{ const [c,op,d]=b.dataset.fatto.split('|'); const x=rigaDi(c,op); regOp([c],op,{data:d||today(),ora:d?'':undefined,min:x.min,modo:x.modo}); refresh(); toast(op+' · '+vlab(c)); });
  $$('[data-salta]',app).forEach(b=>b.onclick=()=>{ const [c,op,d]=b.dataset.salta.split('|'); formSaltato(c,op,d||today()); });
  $$('[data-dmis]',app).forEach(b=>b.onclick=()=>formFerm(b.dataset.dmis));
  $$('[data-tutto]',app).forEach(b=>b.onclick=()=>{ const c=b.dataset.tutto; let n=0; daFareOggi().filter(r=>r.vasca===c&&!r.arretrato&&r.manca&&r.op!=='Misura').forEach(r=>{ for(let i=0;i<r.manca;i++){ regOp([c],r.op,{min:r.min,modo:r.modo}); n++; } }); refresh(); toast(n+' operazioni registrate · '+vlab(c)); });
  $('#vd-pig',app).onclick=()=>formPigiatura();
  $$('[data-lavu]',app).forEach(b=>b.onclick=()=>formPigiatura({uve:[{uva:b.dataset.lavu}]}));
  $$('[data-fm]',app).forEach(b=>b.onclick=()=>formFerm(b.dataset.fm));
  $$('[data-ff]',app).forEach(b=>b.onclick=()=>formFineFerm(b.dataset.ff));

  bindEvOps(app);
}

function formUva(p={},corrId){
  const fonti=[...new Set([...provList(),...S.eventi.filter(e=>e.tipo==='uva'&&e.fonte).map(e=>e.fonte)])];
  const varieta=[...new Set([...(S.varieta||[]),...S.eventi.filter(e=>e.tipo==='uva'&&e.varieta).map(e=>e.varieta)])];
  modal(corrId?'Correggi entrata uva':'Entrata uva',`<form id="fu" novalidate data-nonote>
   <p class="hint">L'uva arrivata resta «in attesa» finché non la lavori con «Pigiadiraspatura / pressatura»: da lì nasce il mosto in vasca.</p>
   <div class="fg">
    <label class="f">Data<input type="date" id="u-data" value="${esc(p.data||today())}"></label>
    <label class="f">Kg<input id="u-kg" inputmode="decimal" value="${p.kg!=null?nfIn(p.kg,0):''}" placeholder="es. 968"></label>
    <label class="f">Classificazione<select id="u-cat"><option value="">—</option>${UVA_CATS.map(([k,t])=>`<option value="${k}" ${p.categoria===k?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}</select></label>
    <label class="f" id="u-denw" ${p.categoria==='Atto a DOP'?'':'hidden'}>Denominazione<select id="u-den">${denList().map(d=>`<option ${p.denominazione===d.nome?'selected':''}>${esc(d.nome)}</option>`).join('')}</select></label>
    <label class="f">Annata<input id="u-ann" inputmode="numeric" value="${esc(annNorm(p.annata)==='S.A.'?'':(p.annata||(p.data||today()).slice(0,4)))}" ${annNorm(p.annata)==='S.A.'?'disabled':''}><span class="row" style="gap:6px;font-size:.85rem;color:var(--ink)"><input type="checkbox" id="u-sa" ${annNorm(p.annata)==='S.A.'?'checked':''}> senza annata (s.a.)</span></label>
    <label class="f">Varietà<input id="u-var" list="u-varl" value="${esc(p.varieta||'')}" placeholder="es. Nebbiolo"><datalist id="u-varl">${varieta.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
    <label class="f">Provenienza / vigneto<input id="u-fonte" list="u-fl" value="${esc(p.fonte||'')}" placeholder="es. Gera"><datalist id="u-fl">${fonti.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
    <label class="f" style="grid-column:span 2">Conto lavorazione per<select id="u-ct"><option value="">— nessuno (vino nostro)</option>${[...new Set([...contiList().map(c=>c.nome),...(p.conto?[p.conto]:[])])].map(n=>`<option ${p.conto===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <label class="f">Grado all'arrivo<input id="u-gr" inputmode="decimal" value="${p.grado!=null?nfIn(p.grado,3):''}" placeholder="facoltativo"></label>
    <label class="f">Scala${scalaSel('u-sc',p.scala)}</label>
   </div>
   <label class="f wide">Note<textarea id="u-no" placeholder="es. messa nel container a prendere freddo">${esc(p.note||'')}</textarea></label>
   <div id="msg" class="err"></div>
   <div class="foot"><button type="button" class="btn" data-close>Annulla</button>${corrId?'':'<button class="btn" data-again>Salva e registra un\'altra</button>'}<button class="btn pri" id="sv">${corrId?'Salva correzione':'Salva'}</button></div></form>`,(b,close)=>{
    let again=false; const ag=$('[data-again]',b); if(ag) ag.addEventListener('click',()=>{again=true;});
    $('#u-cat',b).onchange=()=>{ $('#u-denw',b).hidden=$('#u-cat',b).value!=='Atto a DOP'; };
    $('#u-sa',b).onchange=()=>{ const on=$('#u-sa',b).checked; $('#u-ann',b).disabled=on; if(on) $('#u-ann',b).value=''; };
    $('#u-data',b).addEventListener('change',()=>{ const a=$('#u-ann',b); if(!$('#u-sa',b).checked&&/^\d{4}$/.test(a.value)&&a.value!==($('#u-data',b).value||'').slice(0,4)&&!corrId) a.value=($('#u-data',b).value||today()).slice(0,4); });
    $('#fu',b).onsubmit=e=>{ e.preventDefault(); const m=$('#msg',b); const kg=num($('#u-kg',b).value);
      if(!(kg>0)){ m.textContent='Scrivi i kg di uva.'; again=false; return; }
      const ucat=$('#u-cat',b).value, uann=$('#u-sa',b).checked?'S.A.':(num($('#u-ann',b).value)||'');
      if(!ucat){ m.textContent='Scegli la classificazione dell\'uva.'; again=false; return; }
      if(!uann){ m.textContent='Scrivi l\'annata o spunta «senza annata».'; again=false; return; }
      if(corrId){ const used=((R.uve||{})[corrId]||{usato:0}).usato; if(kg<used-0.5){ m.textContent=`Di quest'uva sono già stati lavorati ${nf(used,0)} kg: correggi prima la pigiatura.`; return; } }
      const sc=$('#u-sc',b).value; S.scalaFerm=sc;
      const ev={id:uid(),tipo:'uva',data:$('#u-data',b).value||today(),ord:Date.now(),fase:'Vinificazione',kg,categoria:ucat,denominazione:ucat==='Atto a DOP'?$('#u-den',b).value:'',annata:uann,varieta:$('#u-var',b).value.trim(),fonte:$('#u-fonte',b).value.trim(),conto:$('#u-ct',b).value,grado:num($('#u-gr',b).value),scala:sc,note:$('#u-no',b).value.trim(),creatoIl:new Date().toISOString()};
      storeEvent(ev,corrId);

}

/* ===================== Descrizione eventi ===================== */
/* movimenti in forma compatta: «V→20 barrique (B001–B020)», «20 barrique (…)→21» */
function trTxt(ts){ if(ts.length<=4) return ts.map(t=>`${vlab(t.da)}→${vlab(t.a)}`).join(', ');
  const byDa={}; ts.forEach(t=>{ (byDa[t.da]=byDa[t.da]||[]).push(t.a); }); const ks=Object.keys(byDa);
  if(ks.length<=3) return ks.map(k=>`${vlab(k)}→${elencoV(byDa[k])}`).join(', ');
  const byA={}; ts.forEach(t=>{ (byA[t.a]=byA[t.a]||[]).push(t.da); }); const ka=Object.keys(byA);
  if(ka.length<=3) return ka.map(k=>`${elencoV(byA[k])}→${vlab(k)}`).join(', ');
  return `${elencoV(ks)} → ${elencoV(ka)}`; }
function evTitle(e){
  if(e.tipo==='carico') return `${e.apertura?'Giacenza di apertura':e.prodotto?'Entrata '+PROD_TXT[e.prodotto]:'Entrata'} · ${vlab(e.vasca)} · ${hL(e.L)}`;
  if(e.tipo==='manutenzione') return `${e.man||'Manutenzione'} · ${elencoV(e.vasche)}`;
  if(e.tipo==='uva') return `Entrata uva · ${uvaLab(e)}`;
  if(e.tipo==='pigiatura') return `${e.lav||'Pigiadiraspatura'} · ${(e.dest||[]).map(d=>vlab(d.vasca)).join(', ')} · ${hL((e.dest||[]).reduce((a,d)=>a+(d.L||0),0))}`;
  if(e.tipo==='fermentazione') return `${e.azione==='fine'?'Fine':'Inizio'} fermentazione · ${elencoV(e.vasche)}`;
  if(e.tipo==='certificazione') return `Certificazione DOP${(e.vasche||[]).length?' · '+elencoV(e.vasche):''}`;
  if(e.tipo==='fineMan') return `Fine manutenzione · ${e.man||''} · ${vlab(e.vasca)}`;
  if(e.tipo==='imbottigliamento') return `Imbottigliamento · ${vlab(e.vasca)} · ${hL(e.L)}${e.lotto?' · lotto '+e.lotto:''}${e.formato?' · '+fmtTxt(e):''}`;
  if(e.tipo==='misura') return `Misura · ${vlab(e.vasca)} · ${hL(e.L)}`;
  if(e.tipo==='annullamento') return 'Annullamento';
  if(e.tipo==='fineLav') return `Fine lavorazione · ${e.lav||''} · ${vlab(e.vasca)}`;
  if(e.tipo==='stato') return `${e.pronto?'Vino pronto da imbottigliare':'Tolto «vino pronto»'} · ${vlab(e.vasca)}`;
  const tr=trTxt(e.tratte||[]);
  return `${e.lav||'Lavorazione'}${tr?' · '+tr:''}${e.tratteTxt?' · '+e.tratteTxt:''}`;
}
function evBody(e){
  const out=[];
  if(e.storico){
    if(e.T) out.push(`<li>Temperatura: ${esc(e.T)}</li>`);
    (e.conferimenti||[]).forEach(c=>out.push(`<li>Conferimento ${esc(c.fonte)}: ${nf(c.qta)} ${esc(c.udm)}</li>`));
    if(e.resa) out.push(`<li>${esc(e.resa)}</li>`);
    (e.apporti||[]).forEach(a=>out.push(`<li>Apporto: ${esc(a.descr)} ${nf(a.qta)} ${esc(a.udm)}</li>`));
    if(e.tratteTxt) out.push(`<li>Vasche: ${esc(e.tratteTxt)}${e.attualiTxt?' · vasche attuali '+esc(e.attualiTxt):''} <span class="muted">(volumi non registrati)</span></li>`);
  }

    const f=()=>{ const d=di.value; if(!d){nt.innerHTML='';return;}

      if(d<today()) parts.push(`<span class="dn-w">Stai registrando al ${fd(d)}, non oggi${UI.asOf&&UI.asOf===d?' (la data della situazione che stai guardando)':''}. Per registrare oggi cambia la data.</span>`);
      if(later) parts.push(`<span class="dn-w">${later===1?'C\'è':'Ci sono'} ${later} operazion${later===1?'e':'i'} registrat${later===1?'a':'e'} con data successiva al ${fd(d)}: vasche e volumi qui sotto sono la situazione al ${fd(d)}, prima di quell${later===1?'a operazione':'e operazioni'}.</span>`);

          const sc=$('#vin-sc',b)?$('#vin-sc',b).value:scalaDef(); const mis=$$('#vin-mis tr[data-mc]',b).map(r=>({c:r.dataset.mc,v:num($('.vm-v',r).value),T:num($('.vm-t',r).value),ph:num($('.vm-p',r).value)})).filter(x=>x.v!=null||x.T!=null||x.ph!=null);

          if((dOps.length||mis.length)&&!ts.length) return msg.textContent='Spunta le vasche su cui hai lavorato.';
          const scrivi=(nota)=>{ dOps.forEach(op=>regOp(ts,op,{data:d,ora,min:num($('#vin-min',b).value),modo:$('#vin-modo',b).value,note:nota||''}));
            if(mis.length){ S.scalaFerm=sc; mis.forEach(x=>{ fermLog().push({id:uid(),vasca:x.c,data:d,ora,val:x.v,scala:sc,T:x.T,ph:x.ph,note:'',vino:R.st[x.c]?R.st[x.c].vino:null});
              const sx=stNow()[x.c]; if(sx&&sx.vino&&!sx.ferm) S.eventi.push({id:uid(),tipo:'fermentazione',azione:'inizio',data:d,ord:Date.now(),fase:'Vinificazione',vasche:[x.c],creatoIl:new Date().toISOString()}); }); } };
          if(!altri){ if(!dOps.length&&!mis.length) return msg.textContent='Tocca un\'operazione o scrivi una misura.'; scrivi($('#l-note',b).value.trim()); close(); refresh();
            toast([dOps.join(', '),mis.length?mis.length+' misur'+(mis.length>1?'e':'a'):''].filter(Boolean).join(' · ')+' · '+ts.map(vlab).join(', ')); return; }
          dCh.forEach(x=>x.checked=false); orig(e);
          if(!document.body.contains(b)){ if(dOps.length||mis.length){ scrivi(''); refresh(); } } else dCh.forEach(x=>x.checked=true); };
      },0);
    })();
    $('#fl',b).onsubmit=sub=>{
      sub.preventDefault(); const msg=$('#msg',b); msg.textContent='';
      aggVasche(); if($('.a-vw',b)){ $('.a-vw',b).scrollIntoView({block:'center'}); msg.textContent='Un prodotto è assegnato a una vasca che non è più tra quelle trattate: scegli a quale vasca va.'; return; }
      const data=$('#l-data',b).value; if(!data){msg.textContent='Inserisci la data.';return;}
      const tr=readTratte();
      for(const [i,t] of tr.entries()){
        if(!t.da){msg.textContent='Scegli la vasca di partenza.';return;}
        if(!t.a){msg.textContent=`Destinazione ${i+1}: scegli la vasca di arrivo.`;return;}
        if(t.da===t.a){msg.textContent=`Destinazione ${i+1}: partenza e arrivo sono la stessa vasca.`;return;}
        if(!t.L||t.L<=0){msg.textContent=`Destinazione ${i+1}: inserisci la quantità arrivata.`;return;}
        if(t.nv&&pickerErr(t.nvf)){msg.textContent=`Destinazione ${i+1}, nuovo vino: ${pickerErr(t.nvf)}.`;return;}
      }
      const lavori=$$('#l-ops input[type=checkbox]:checked',b).map(x=>x.value), altro=$('#l-altro',b).value.trim();
      const vasche=$('#fsV',b).hidden?[]:$$('#vch input:checked',b).map(x=>x.value);
      const perdL=[]; for(const d of $$('#perd .pline',b)){ const c=$('.pe-v',d).value, q=num($('.pe-q',d).value), m=$('.pe-m',d).value, tp=$('.pe-t',d).value, fd=$('.pe-f',d).value;
        if(!c&&q==null) continue; if(!c||!vasche.includes(c)){ msg.textContent='Perdita: scegli una delle vasche trattate.'; return; }
        if(q==null||q<0||(m==='L'&&q===0)){ msg.textContent=`Perdita in ${vlab(c)}: indica la quantità.`; return; }
        if(tp==='recupero'&&!VMAP[fd]){ msg.textContent=`Perdita in ${vlab(c)}: scegli dove vanno le fecce da recuperare.`; return; }
        if(tp==='recupero') fecceScheda();
        perdL.push({vasca:c,L:m==='L'?q*100:null,volDopo:m==='dopo'?q*100:null,tipo:tp,feccDest:tp==='recupero'?fd:'',fecceVino:tp==='recupero'?FECCE_ID:null}); }
      const av=autoVol();
      const aggiunte=$$('#aggs .line',b).map(d=>{const vm=toL($('.a-v',d).value,'hL'); const vs=$('.a-vs',d).value; const avr=vs?Math.max(0,autoVol(vs)):av; return {prodotto:$('.a-p',d).value.trim(),dose:num($('.a-d',d).value),udm:$('.a-u',d).value,vasca:vs||'',volL:vm||avr||null,volManual:!!vm,reale:$('.a-r',d).value.trim()}}).filter(a=>a.prodotto);
      if(!tr.length&&!vasche.length&&!aggiunte.length&&!$('#l-note',b).value.trim()){msg.textContent='Aggiungi almeno un movimento, una vasca, un prodotto o una nota.';return;}
      // conferma assemblaggi
      if(pending){ let bad=false; $$('#conf fieldset[data-ci]',b).forEach(fs=>{const r=$('input:checked',fs); if(r.value==='__new'){ const f=pickerRead(fs,'rs'+fs.dataset.ci); if(pickerErr(f)){bad=pickerErr(f);return;} tr[+fs.dataset.ci].ris={nuovo:f}; } else tr[+fs.dataset.ci].ris=r.value;});
        if(bad){msg.textContent='Per il nuovo vino del taglio '+bad+'.';return;} }
      const evId=uid();
      const tmpVini=[];
      const resNew=(f,nota)=>{ const ex=findVino(f); if(ex) return ex.id; const k=[f.categoria,isDop(f.categoria)?f.denominazione:'',f.colore,f.fantasia,f.annata].join('|').toLowerCase();
        let id=nvCache[k]; if(!id) id=nvCache[k]='nv'+uid(); if(!tmpVini.some(v=>v.id===id)){ const nv=pickerResolve(f).nuovo; tmpVini.push({...nv,id,note:nota}); } return id; };
      const ev={id:evId,tipo:'lavorazione',giorni:num($('#l-gg',b).value)||0,pronto:$('#l-pronto',b).checked,lavori,altro,data,ord:corrId?(S.eventi.find(x=>x.id===corrId).data===data?S.eventi.find(x=>x.id===corrId).ord:Date.now()):Date.now(),fase:$('#l-fase',b).value,lav:composeLav(tr.length>0,lavori,altro,aggiunte.length>0),vasche,aggiunte,note:$('#l-note',b).value.trim(),creatoIl:new Date().toISOString(),
        tratte:tr.map(t=>{let nv=null; if(t.nv){ const srcV=stNow()[t.da].vino; nv=resNew(t.nvf,'Creato da una porzione di '+vName(srcV)); if(nv===srcV) nv=null; }
          let fv=null, fd=(t.diffTipo==='recupero'&&(t.svuota||t.diffL))?t.feccDest:'';
          if(fd&&VMAP[fd]) fv=FECCE_ID;
          const parti=(t.parti||[]).map(x=>({L:x.L,tipo:x.tipo,feccDest:x.tipo==='recupero'&&VMAP[x.feccDest]?x.feccDest:(x.tipo==='recupero'&&x.feccDest==='__dam'?'__dam':''),fecceVino:x.tipo==='recupero'&&VMAP[x.feccDest]?FECCE_ID:null}));
          if(parti.some(x=>x.fecceVino)||fv) fecceScheda();
          return {da:t.da,a:t.a,L:t.L,stima:t.stima,svuota:!!t.svuota,diffL:t.svuota?(t.diffL!=null?t.diffL:null):(t.diffL||0),diffTipo:(t.diffL||t.svuota)?t.diffTipo:'',feccDest:fd,fecceVino:fv,parti:t.svuota&&parti.length?parti:undefined,nuovoVino:nv,risultante:t.ris&&t.ris.nuovo?resNew(t.ris.nuovo,'Nato dal taglio in '+vnome(t.a)):(t.ris||null)};})};
      if(perdL.length) ev.perdite=perdL;
      if(corrId){ const mc=$('#l-mc',b); if(mc) ev.motivoCorr=mc.value.trim(); }
      // simulazione
      { const st0=stateAt(data,ev.ord,corrId); const srcs=[...new Set(ev.tratte.map(t=>t.da))].filter(c=>st0[c]&&st0[c].imp);
        if(pending) ev.chiudeLav=srcs.filter(c=>{const r=$(`#conf input[name="imp_${c}"]:checked`,b); return !r||r.value==='si';});
        else ev._imps=srcs.map(c=>({c,imp:st0[c].imp})); }
      const sim=replay([...S.eventi.filter(e=>e.id!==corrId),ev]);
      const cf=(sim.conflitti[ev.id]||[]).filter(c=>c.idx!=null&&!ev.tratte[c.idx].risultante);
      const ecc=Object.entries(sim.ecc).filter(([k])=>k.startsWith(ev.id+'_')).map(([,x])=>x);
      const eccSv=ev.tratte.map((t,i)=>({t,dc:sim.diffCalc[ev.id+'_'+i]})).filter(x=>x.t.svuota&&x.dc&&x.dc.calc<-1e-6);
      const imps=ev._imps||[]; delete ev._imps;
      const capO=(()=>{ const st0=stateAt(data,ev.ord,corrId); const dL={}; ev.tratte.forEach(t=>{ if(t.a) dL[t.a]=(dL[t.a]||0)+(t.L||0); if(t.da) dL[t.da]=(dL[t.da]||0)-(t.L||0)-(t.diffL&&t.diffTipo!=='resta'?t.diffL:0); }); return oltreNominale(dL,st0); })();
      if((cf.length||ecc.length||eccSv.length||imps.length||capO.length)&&!pending){
        pending=true;
        const eccHtml=(ecc.length||eccSv.length)?`<div class="box warn" style="margin-bottom:8px"><b>Esce più vino di quello presente.</b><ul style="margin:6px 0">${ecc.map(x=>`<li>Dalla ${esc(vnome(x.vasca))} escono ${hL(x.L)} in più di quanto risulta presente.</li>`).join('')}${eccSv.map(x=>`<li>Nella ${esc(vnome(x.t.a))} arrivano ${hL(-x.dc.calc)} in più del teorico della ${esc(vnome(x.t.da))}.</li>`).join('')}</ul>Se confermi, la vasca di partenza risulta vuota (non va sotto zero) e la differenza resta registrata da verificare.</div>`:'';
        const impHtml=imps.length?`<div class="box warn" style="margin-bottom:8px"><b>Vasca in lavorazione.</b>${imps.map(x=>`<fieldset style="margin-top:6px"><legend>${esc(Vnome(x.c))}</legend><p style="margin:0 0 6px">${impTxt(x.imp,data)}. La lavorazione è finita?</p>
          <label><input type="radio" name="imp_${x.c}" value="si" checked> Sì, la lavorazione è finita</label> <label><input type="radio" name="imp_${x.c}" value="no"> No, continua (es. travaso parziale)</label></fieldset>`).join('')}</div>`:'';
        const capHtml=capO.length?`<div class="box warn" style="margin-bottom:8px"><b>Oltre la capacità nominale.</b><ul style="margin:6px 0">${capO.map(x=>`<li>${oltreTxt(x)}</li>`).join('')}</ul>Se è giusto, conferma: il contenitore resterà segnato con il bordo rosso tratteggiato.</div>`:'';
        $('#conf',b).innerHTML=capHtml+impHtml+eccHtml+(cf.length?`<div class="box warn"><b>Possibile assemblaggio.</b> ${cf.map(c=>c.same?`<fieldset data-ci="${c.idx}" style="margin-top:8px"><legend>${esc(Vnome(c.dest))}</legend>
          <p>Contiene già <b>${esc(vName(c.vinoDest))}</b> (${hL(c.Ldest)}) di un'altra partita. Stai aggiungendo ${hL(c.Lin)} dello stesso vino ma di partita diversa: unendole il nome resta <b>${esc(vName(c.vinoDest))}</b> e il programma tiene traccia di entrambe le partite.</p>
          <input type="radio" name="r${c.idx}" value="${c.vinoDest}" checked hidden></fieldset>`:`<fieldset data-ci="${c.idx}" style="margin-top:8px"><legend>${esc(Vnome(c.dest))}</legend>
          <p>Contiene già <b>${esc(vName(c.vinoDest))}</b> (${hL(c.Ldest)}). Stai aggiungendo <b>${esc((tmpVini.find(x=>x.id===c.vinoIn)||{}).nome||vName(c.vinoIn))}</b> (${hL(c.Lin)}). Il vino risultante si chiama:</p>
          <label><input type="radio" name="r${c.idx}" value="${c.vinoDest}" checked> ${esc(vName(c.vinoDest))} <span class="muted">(vino della vasca, proposto)</span></label>
          <label><input type="radio" name="r${c.idx}" value="${c.vinoIn}"> ${esc((tmpVini.find(x=>x.id===c.vinoIn)||{}).nome||vName(c.vinoIn))}</label>
          <label><input type="radio" name="r${c.idx}" value="__new"> un nuovo vino</label>
          <div class="fg rs-new" hidden style="margin-top:6px">${vinoPicker('rs'+c.idx,null)}</div></fieldset>`).join('')}
          <p class="small" style="margin:8px 0 0">La provenienza viene conservata in ogni caso. Le analisi precedenti non passano al vino risultante.</p></div>`:'');
        $$('#conf fieldset[data-ci]',b).forEach(fs=>{ const box=$('.rs-new',fs); if(!box) return; const px='rs'+fs.dataset.ci; pickerBind(fs,px);
          const cc=sim.conflitti[ev.id].find(c=>c.idx===+fs.dataset.ci); const vin=vino(cc&&cc.vinoDest)||{}; if(vin.annata) annSet(fs,px,vin.annata);
          $$('input[type=radio]',fs).forEach(x=>x.onchange=()=>{ box.hidden=$('input:checked',fs).value!=='__new'; }); });
        $('#sv',b).textContent='Conferma e salva'; return;
      }
      tmpVini.forEach(v=>{ if(!vino(v.id)) S.vini.push(v); });
      // nuovi prodotti nel catalogo
      aggiunte.forEach(a=>{ if(!S.prodotti.some(x=>x.nome.toLowerCase()===a.prodotto.toLowerCase())) S.prodotti.push({nome:a.prodotto,udm:a.udm,daUso:true}); });
      storeEvent(ev,corrId); close(); refresh(); toast(corrId?'Correzione salvata':'Lavorazione salvata');
    };
  });
}
